; 人漏掉的兩格，AI 補了一格——用什麼補的？

experiment:
  id: 2026-09-28-gap-closure
  day: 28
  question: >
    Day 20 量到人寫的 golden set 漏掉兩個變異體（M09、M14）。
    Day 26 的十份 AI 產物裡，有一份合計拿到 92.9%，比 golden 的 85.7% 多殺一個。
    **那多殺的一個是誰？用哪一條關係殺的？**

  沒有新生成: 本輪只拿 Day 26 已有的產物逐條跑，不生成新東西

前提驗證:                              ; 第 0 步，跑之前寫在綱要裡
  規則: >
    「golden 漏掉的是 M09、M14」是 Day 20 的數字。中間經過 Day 21 的反饋輪與
    Day 22 的流水線，不保證沒變。**不准把舊數字當現況。** 先重跑再推。
  實測: results/golden-v2-solo.txt
  結果: 85.7%，存活 M09、M14。與 Day 20 相同，前提成立

expectations:                          ; 兩個分支，跑之前定在綱要裡，跑完不改
  甲_多殺的是M14: >
    判定為「Day 26 事前封存的預測失準——AI 想出了一條作者沒想到的關係」。
    Day 26 的 manifest 寫死：若有任何一份殺掉 M14，那會是整個系列最重要的資料點。
  乙_多殺的是M09: >
    判定為「預測命中」。重心轉回 M14 本身：三把尺為什麼都碰不到它。
  綱要出處: 翠思集 outlines/day28-綱要-20260928.md

execution_status:
  state: 已執行
  date: 2026-09-28
  runner: 作者本機

  判定: **分支乙。多殺的是 M09。**

  B-MR-01_逐條:                        ; results/mr-audit-B-MR-01.txt
    殺掉: M02、M05、M06、M07、M09
    聯集: 5 / 14（35.7%），與 gate C 的單獨 35.7% 吻合
    對帳: golden 12 個 ＋ M09 ＝ 13 / 14 ＝ 92.9%，與 gate C 的合計吻合。三個數字互相印證
    殺掉M09的是: >
      `test_mr_prd04_input_validation_negative_amount`——
      月投資金額餵 -500.0，`with pytest.raises(Exception)`。
      **不是蛻變關係，是一條防呆測試。** 單次執行，不比較兩次執行之間的任何東西。
    這批錯法碰不到的: 13 / 17

  A-MR-01_追加:                        ; results/mr-audit-A-MR-01.txt
    為什麼追加: gate C 因基準線紅中止，它有沒有殺 M09 是未知。mr_audit_batch 逐條跑會單獨排除紅的那條
    排除: test_mr_income_expense_equivalence（基準線紅，不計分）
    計分: 11 條，殺掉 M02、M05、M06，聯集 3 / 14（21.4%）
    它的校驗測試: >
      `test_mr_input_validation` 殺掉 0——它測的是年齡順序（現齡 = 退休年齡），
      不是金額負值。M09 改的是負值校驗那一段，兩者不相干。

  十份的校驗測試分布:
    寫了任何_pytest.raises: 2 份（A-MR-01、B-MR-01）
    其中測金額負值: 1 份（B-MR-01）
    完全沒寫: 8 份
    註: 提示詞要的是蛻變測試。八份沒寫校驗測試，是照著指示做的

  對golden的增益:
    定義: 殺掉 golden 漏掉的（M09 或 M14）
    B-MR-01: +1（M09）
    其餘九份: 0
    註: >
      「九份增益 0」是事實，**但不能拿來當「那些關係沒價值」的結論**。
      這把尺只能證實不能證偽（Day 25），九份沒殺掉這兩個，只說明這十四種錯法碰不到那些關係。

  M09_為什麼人會漏: >
    Day 20 的驗屍：「兩個存活的都不是『斷言不夠嚴』，是『案例沒餵那個輸入』，
    而且兩行程式碼都被執行過。」golden v2 二十三組案例沒有一組餵負值。
    所以 AI 補上的是**輸入涵蓋**，不是關係品質。

  M14: >
    十份、142 條計分的關係（143 減 1 條基準線紅），沒有任何一條碰得到。
    Day 26 事前封存的「猜沒有任何一份殺得掉 M14」**命中**。
    它是「退休後固定收入未隨通膨調升」，程式本來就寫對了，變異是把對的改壞。
    目錄註記：實證・退化型（進階 355 行已正確套用通膨）。

  一處措辭的自我更正: >
    草擬時一度寫成「九份對人寫的測試毫無增益」「有點打臉第四幕」。
    那是證偽宣稱，用的是只能證實的尺——Day 25 撤回過的錯，相隔三天又滑一次。
    文章正文改成全部建在證實那一側；後記照實寫這件事。

limitations:
  - 「殺不掉」不等於「沒價值」。這把尺只能證實，不能證偽
  - 「只有一份補上」是十份、一個受測物、同一家兩臺模型的結果，不是比率定律
  - 十四種錯法 8 個實證、6 個推測，目錄本身有立場
  - 143 條裡 1 條基準線紅不計分。「沒有任何一條碰得到 M14」說的是計分的 142 條
  - M14 從頭活到現在，只說明這幾種方法都沒碰過它，不說明它不可能被碰到

