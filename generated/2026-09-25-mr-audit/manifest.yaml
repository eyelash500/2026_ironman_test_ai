; 誰來驗收蛻變關係：四條人手寫的關係，殺得掉幾個變異體？
; 本檔在跑之前寫完。跑完只准往 execution_status 補記，不准改 expectations。

experiment:
  id: 2026-09-25-mr-audit
  day: 25
  question: >
    蛻變關係不需要 oracle，但它需要「關係本身是對的、而且夠緊」。
    一條關係可能是廢話（恆真）、可能太弱（方向對但約束鬆）——
    兩種在報表上都是綠的，肉眼分不出來。
    拿 Day 19 的十四個領域變異體逐條試：**這條關係殺得掉幾個？**

subject: 作者手寫的四條關係。先量自己，再拿同一把尺去量 AI。

relations:
  MR-01:
    名稱: 線性齊次
    變換: 所有金額欄位同乘 k（k = 0.5／2／10），年齡與比率不動
    應有關係: projected_savings、target_fund、retirement_gap 都剛好乘 k
    為什麼不需要答案: 一次齊次函式的性質，不必知道任何一次的值
  MR-02:
    名稱: 單調性
    變換: 月存↑／壽命↑／生活費↑／其他收入↑
    應有關係: 資產不減、缺口不增、目標不減、目標不增
    為什麼不需要答案: 方向由領域常識決定——多存不會更窮，多活不會更便宜
  MR-03:
    名稱: 支出配置不變
    變換: 在「月支出 × 12」與「固定年支出」之間搬動，年總額不變
    應有關係: 三個輸出逐位元相同
    來源: >
      原規劃是「六格支出重分配」，那是受測物 HTML 的介面，
      Python 這一層只有一個 monthly_expense_today。翻開實作才看到真正的不變量：
      `expense_base_today = monthly_expense_today * 12 + annual_recurring_expense`，
      而 PRD-08 說兩者合併、共用同一組通膨指數。
  MR-04:
    名稱: 自我一致性
    變換: 報酬率與月存設為 0，再把期初本金設成第一次算出的目標金額
    應有關係: 缺口為 0、期末餘額為 0
    為什麼不需要答案: >
      把第一次執行的輸出當成第二次執行的輸入。
      目標金額是多少不必知道，只要兩條路徑（折現與軌跡）對得起來。

fixture_note: >
  `other_income` 刻意設為非零（5000）。Day 20 起它一直是 0，
  那條路徑從來沒被走過，而 M14 就住在那裡。

tool:
  file: tools/mr_audit.py（3 條 KAT）
  做法: 每條關係單獨跑（pytest -k），逐一注入十四個變異體，看它殺得掉哪些
  判定: 沿用 Day 18——回傳碼 1 殺掉、0 存活、其餘無效
  守衛:
    - 每條關係在未變異的實作上必須先全綠，否則中止
    - >
      `-k` 樣式選不到任何測試時 pytest 回傳 5，必須攔下。
      不攔的話那條關係會顯示「殺 0 個」，看起來就像它是廢話——
      而它其實根本沒跑。同 Day 24 的教訓：工具在什麼都沒做的時候必須閉嘴。
  harness 異動: run_tests／evaluate 新增 extra_args，用來傳 -k

expectations:                          ; 跑之前寫下，跑完不改
  MR-01 可能是廢話: >
    **這是我最沒把握、也最想驗的一條。**
    MR-01 比的是同一份（被變異的）實作在兩種尺度下的輸出。
    只要那個變異仍然保持一次齊次，關係就不會破。
    而十四個變異體多半是索引位移、利率定義、邊界比較——這些都是齊次的。
    `max(0, ...)` 對 k > 0 也齊次。
    所以我猜 **MR-01 殺掉的數字接近 0**。
    若成立，那就是「我自己寫出了一條漂亮但無用的關係」。
  MR-02 偏弱: >
    單調性只約束方向，不約束幅度。改壞的實作通常還是單調的。
    猜 0 到 2 個。
  MR-03 未知: >
    它抓的是「月支出與固定年支出被差別對待」。
    目錄裡沒有專門打這一處的變異體，所以可能 0；
    但通膨基準相關的變異（M10、M13）有機會連帶破壞它。
  MR-04 是主力: >
    它是唯一同時牽動「折現路徑」與「餘額軌跡」兩條路的關係。
    M01（折現指數）、M02（餘額夾 0）、M11（報酬率切換點）改的正是這兩條的一致性。
    猜 MR-04 殺最多。
  M14 四條全部抓不到: >
    **本輪的試金石。** M14 是「退休後收入不隨通膨調升」。
    - MR-01 抓不到：它改的是通膨指數，不是齊次性，收入照樣隨 k 縮放
    - MR-02 抓不到：收入增加仍然讓目標金額下降，方向沒變
    - MR-03 抓不到：那是支出端的不變量
    - MR-04 抓不到：目標與軌跡用的是同一份（壞掉的）收入，兩邊仍然自洽
    要殺它需要一條「通膨率與收入交互」的關係，而那需要領域洞察，
    不是套公式套得出來的。
    **若四條真的全部抓不到，那就是第四幕要面對的問題，不是意外。**
  自我提醒: 猜對不值得高興，猜錯才是資料

execution_status:
  state: 已執行
  date: 2026-09-25
  runner: 作者本機

  逐條結果:
    MR-01 線性齊次: 殺 0
    MR-02 單調性: 殺 0
    MR-03 支出配置不變: 殺 0
    MR-04 自我一致性: 殺 2（M01、M11）
  聯集: 2 / 14（14.3%）
  沒有任何一條抓得到: M02、M03、M04、M05、M06、M07、M08、M09、M10、M12、M13、M14

  對照: >
    人寫的 golden set 單獨 85.7%（Day 22），AI 寫的 PRD 組單獨也是 85.7%。
    **我手寫的四條蛻變關係，聯集只有 14.3%。**

  expectations_vs_result:
    MR-01 可能是廢話: 猜中。而且是最想驗的那一條
    MR-02 偏弱猜 0–2: 猜中（0）
    MR-03 未知: 0
    MR-04 是主力: 方向猜中，但只殺 2 個。事前列的 M01／M02／M11 裡，M02 沒中
    M14 四條全部抓不到: **猜中**。理由逐條寫在 expectations，實測相符
    整體: >
      五項預測四項猜中，唯一沒中的是 M02（餘額軌跡夾 0）為什麼逃過 MR-04。
      猜中的部分不值得高興——**它證明的是我事前就知道自己會寫出廢話，
      卻還是寫了三條**。

  legacy_上的意外:
    現象: >
      MR-04 在 legacy（帶著四個缺陷的那一版）上**紅了**：
      資金設成剛好等於目標金額之後，期末餘額是 −28,813.50 而不是 0。
    意義: >
      這是本系列第一次，有測試在**完全不知道正確答案**的情況下指出 legacy 有問題。
      Day 6 的差分測試需要影子模型當 oracle，Day 20 的變異測試需要現成的斷言——
      MR-04 兩者都不需要，它只問「這兩條路徑對得起來嗎」。
    驗屍: >
      **確認是缺陷 A，不是語意差異。**
      legacy 的兩條路徑對「提領時點」的假設不一致：
        目標金額（`shadow/calc.py` 321–322）：`net / (1 + r_p) ** i`，i 從 1 起
          → **期末年金折現**
        餘額軌跡（372）：`remaining = (remaining − 扣款) * (1 + r_p)`
          → **期初扣款後滾存**
      把折現改成期初（每項乘上 (1 + r_p)）之後重跑：
        目標金額　328,752.69 → 341,902.79，比值 **1.040000**，精確等於 1 + r_p
        期末餘額　−28,813.50 → **−0.00**
      那個 (1 + r_p) 就是 [Day 4](https://ithelp.ithome.com.tw/articles/10407397)
      推導的同一個因子——「沒有人能等到年底才吃第一頓飯」。
    為什麼這件事重要: >
      第一幕確認缺陷 A 靠的是人工推導加數學論證。
      Day 6 的差分測試抓不到它——影子模型逐行複製受測物，兩邊一起錯。
      **MR-04 只用一條關係就指出它，而且不需要知道目標金額該是多少。**
      這是「不需要 oracle 的方法，抓到了需要 oracle 的方法漏掉的東西」的實證。

  判準的方向性:                        ; 2026-09-26 更正
    初版的錯: >
      初版把「殺 0 個」判為「廢話，不列入」，工具也照這樣印。
      **那個推論不成立。**
      殺 0 個只證明這十四種錯法碰不到那三條關係，不證明關係沒用——
      若實作把某個比例運算寫成「加一個固定常數」，MR-01 一秒就抓到，
      只是我設計的十四個變異體裡剛好沒有那種非齊次的錯法。
    為什麼是個嚴重的錯: >
      它讓一把**已知有盲區**的尺變成唯一裁決。
      Day 20 自己寫過「分母換一份目錄，分數就換一個」；
      Day 23 整篇在講「把指標當目標，它就不再是好指標」。
      本輪的 limitations 也寫了「變異體目錄對蛻變關係不必然公平」——
      **註腳說一套，標題做另一套。**
    更正後的表述: >
      **這把尺只能證實，不能證偽。**
      殺得掉 → 這條關係有用。
      殺不掉 → 只說明這十四種錯法的形狀，關係本身待判。
    連帶處置:
      - tools/mr_audit.py 的「廢話，不列入」改為「這批錯法碰不到」，檔頭記錄原因
      - 文章標題由〈我寫了四條蛻變關係，三條是廢話〉改寫，重心移到 MR-04 抓到缺陷 A
      - 不另外造一個「MR-01 抓得到」的變異體來替它辯護——
        那是自導自演，同樣手法可以替任何一條關係脫罪
    誰指出的: 讀者。原文發表前的草稿階段

  limitations:
    - 四條關係是作者一個人在一個下午寫的，不代表「蛻變關係能做到的上限」
    - 變異體目錄是 Day 19 為了打 calc_fixed 設計的，對蛻變關係不必然公平
    - 「廢話」的判準是「殺不掉這十四個」，換一份目錄結論可能不同
    - MR-03 抓的那個不變量，目錄裡本來就沒有專打它的變異體
