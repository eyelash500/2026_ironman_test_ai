; 第一次變異分數量測。本檔在跑之前寫完。
; 跑完只准往 execution_status 補記，不准改 plan、pairing 與 expectations。

experiment:
  id: 2026-09-18-first-mutation-score
  day: 20
  question: >
    14 個人工設計的領域變異體注進 calc_fixed，
    由 golden v2 套件應戰，殺得掉幾個？

pairing:
  base: shadow/calc_fixed.py          ; PRD v1.2 的實作
  suite: tests/test_golden_v2.py      ; 23 組案例，21 組鎖數值、2 組要求拋 ValueError
  mutants: tools/domain_mutants.py    ; 14 個，實證 8、推測 6
  engine: tools/harness.py --domain
  note: >
    大綱原寫「對 tests/test_characterization.py 量測」——那是錯的。
    characterization 套件 import 的是 legacy shadow/calc.py，
    領域變異體改的是 calc_fixed.py，打不到它。
    repo 裡唯一 import calc_fixed 的套件就是 test_golden_v2.py，
    所以配對只有一種可能。此更正在跑之前寫下。

precondition:
  - 目錄自檢通過：片段唯一性 14/14、變異後語法 14/14、證據等級齊備
  - 基準線全綠：未變異時 test_golden_v2.py 必須 pass（harness 的 _assert_baseline）
  - 沒有 pytest 的環境會讓 14 個全回 ERROR，分母為零、分數無法計算 —— 那不是結果

scoring:
  formula: 殺掉 ÷ (總數 − 等價 − ERROR) × 100%
  equivalent: 由人工判定後才標記，harness 不猜
  timeout: 視為殺掉，但另記

expectations:                          ; 跑之前寫下的猜測
  note: 猜對要自問有沒有在設計變異體時偏向好殺的；猜錯才是資料
  overall: >
    偏高。golden v2 有 21 組鎖死到 rel_tol 1e-12 的數值斷言，
    任何全域倍數或指數偏移都會當場紅。
  likely_killed: >
    M01（折現指數 +1）、M03（有效月利率）、M05（移除截斷）、
    M10（通膨基準年 −1）、M13（大筆支出不計通膨）、M14（收入不抗通膨）——
    這六個都會改變基準情境的金額。
  likely_survived: >
    M07（大筆支出 >=）、M11（提領首年報酬率）、M12（起領年齡 >）——
    邊界類，只有恰好踩到那個年齡的 case 才會紅，而 23 組是點不是面。
    M02（餘額夾 0）取決於套件有沒有比對 balances_raw 的逐項值。
  likely_error_or_equivalent: >
    M06 改動迴圈上界，若某些 case 沒有 lump_sums，變異後行為與原本相同 → 可能是等價變異體。
    M08／M09 拿掉校驗，對 21 組合法輸入無影響，只有那 2 組非法輸入會抓到。
  third_case: >
    最可能也最有教學價值的結果：分數不低，但存活的剛好全是邊界類。
    那會證明「分數的組成比分數本身重要」。

execution_status:
  state: 已執行
  date: 2026-09-19
  runner: 作者本機（Python 3.14.5、pytest 9.1.1、repo venv/）

  results:
    killed: [M01, M02, M03, M04, M05, M06, M07, M08, M10, M11, M12, M13]
    survived: [M09, M14]
    error: []
    equivalent: []
  score: 85.7                          ; 12 / 14

  autopsy:
    M09:
      verdict: 真漏洞，非等價
      cause: >
        23 組案例裡**沒有一組含負值輸入**。兩組「預期被拒」的
        （def_b_inverted、def_b_equal）都是年齡順序違規，不是金額違規。
        移除金額負值校驗這件事，這套測試從頭到尾沒有機會發現。
      line_executed: true              ; 第 84 行執行了 23 次，但條件恆為 False
    M14:
      verdict: 真漏洞，非等價
      cause: >
        23 組的 other_income **全部為 0**。
        `0 * 12 * (1+i)^k` 與 `0 * 12` 恆等，拿掉通膨指數化沒有任何一組會變。
      line_executed: true              ; 第 129 行執行了，但乘數為 0

  key_finding: >
    兩個存活的都不是「斷言不夠嚴」，是「案例沒餵那個輸入」，
    而且兩行程式碼**都被執行過**。這是 Day 17「行被執行過不等於邏輯被檢驗過」
    的實證——當時只能推論，現在有兩個具名的變異體站在那裡。

  input_space_gaps:                    ; 順手掃出來的，golden v2 的輸入涵蓋
    other_income: 0 / 23
    annual_recurring_expense: 0 / 23   ; PRD-08，Day 14 列的待補測試之一，至今仍空
    labor_pension_monthly: 1 / 23
    labor_insurance_pension: 4 / 23
    lump_sums: 6 / 23

  expectations_vs_result:
    猜錯: >
      預期存活的 M07、M11、M12（邊界類）全部被殺。
      原因推測：23 組裡有 6 組帶 lump_sums、4 組帶勞保，
      這些邊界剛好被踩到了——「23 組是點不是面」這個說法對，
      但那些點的位置比我以為的準。
    猜對一半: M09 我列在「可能無效或等價」，方向對，但理由不同（我猜等價，實際是輸入沒覆蓋）
    完全沒猜到: M14。我把它歸在 likely_killed，因為沒去看 other_income 的實際值
    第三種情境: 未發生。存活的不是邊界類，是輸入空間沒覆蓋到的兩個欄位

  not_amended: >
    不回頭補 golden set。存活的變異體是產出不是故障，
    現在補案例會讓分數變 100%，而那個 100% 是調出來的不是量出來的。
    補洞與「補完之後分數變多少」另立實驗編號。
