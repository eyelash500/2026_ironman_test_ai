; 邊界值與整數偏好：AI 寫的測試挑什麼數字？
; 本檔在 Day 22 的二十份腳本產出**之前**寫完。跑完只准往 execution_status 補記。

experiment:
  id: 2026-09-23-boundary-goodhart
  day: 23
  question: >
    AI 在腳本裡實際寫進去的參數值長什麼樣？
    年齡是不是全落在 5 的倍數、金額是不是整萬、邊界 ±1 有沒有人寫過？
    以及：同一份資料由人寫和由 AI 寫，分佈差在哪？

depends_on:
  upstream: 2026-09-22-scripts-matrix（二十份腳本）
  note: >
    主表要等 Day 22 產出才跑得了。但基準線不必等——
    人寫的那幾份今天就在 repo 裡。**先量人的，再量 AI 的**，
    這個順序保證基準線不是看完 AI 產物之後才決定要怎麼量的。
    （Day 21 的人工對照組就是敗在順序：助手先印了 AI 產物，對照組當場失效。）

tool:
  file: tools/const_sampler.py
  kat: 8 條，人手寫
  reuses: >
    邊界命中直接呼叫 Day 12 的 `bva_checker.check_bva`，不另寫判定。
    案例字典格式刻意相同——同一條尺量文件層與代碼層，數字才可比。
  discrimination:
    問題: >
      `assert result.target_fund == 22938825.0` 的那個數字是期望值不是輸入。
      混進去，「金額分佈」會多出一堆七位數，結論整個歪掉。
    規則:
      - 落在 `ast.Assert` 底下的數值 → 期望值，排除
      - 綁在已知欄位名的關鍵字引數上 → 輸入（不認函式名，只認欄位名）
      - 兩者皆非 → 其他，照實報數量，不塞進任何一群
    為什麼不認函式名: >
      產物幾乎都包一層自己的 helper（`_p(...)`、`get_valid_params(...)`）。
      認 `Params(` 會整批漏掉。
  known_limitation:
    基準情境: >
      `get_valid_params(retirement_age=65)` 這種寫法，呼叫點只看得到一個欄位。
      本檔把欄位數最多的那一處當基準情境併進去，**並把這個動作印出來**——
      它是推論不是讀到的事實。
      Day 12 的 `case_extractor.py` 在文件層撞過同一件事（「同上」「其餘同 baseline」）,
      到了代碼層它換個樣子又出現一次。
    json_vs_script: >
      `golden_set_v2.json` 的 `input` 與 `expected` 天生分在兩個 key 底下，
      不必猜。腳本沒有這條分界線——上面那兩條判別規則的存在理由就是這個。
  guard: >
    全部檔案加起來抽到 0 個輸入數值時直接中止。
    抽取規則沒對上產物的寫法時，印「整數偏好 0%」比不印更糟。

baseline:                              ; 2026-09-22 量，Day 22 的腳本尚未產出
  file: baseline.txt
  人工:
    golden_set_v2.json: 年齡 72% 是 5 的倍數、金額 67% 是整萬、比率 100% 是 0.01 倍數
    測得的邊界: A_r < A_d 命中 67%（缺 off-above）；其餘四條皆 33% 或 0%
  ai_三份（Day 21 的補測試產物，反饋實驗的副產品）:
    run-01: 年齡 100% 是 5 的倍數；金額 0% 是整萬；六條邊界全 0%
    run-02: 年齡 92%；金額 0% 是整萬（20 / 26 是 0）；六條邊界全 0%
    run-03: 年齡 43%；金額 0% 是整萬；**A_c < A_r 與 A_r < A_d 各命中 33%**
  值得記下來的一件事: >
    三份裡只有 run-03 碰到了邊界（`A_r < A_d` 命中 on-point，即 `A_r == A_d`），
    而 run-03 正是唯一沒過基準線的那一份——它就是為了湊手算值把兩個年齡設成同年，
    結果踩進非法輸入。**唯一碰到邊界的，就是唯一摔跤的。**
    n = 3，而且那三份的任務是「補指定行號的測試」不是「寫完整測試」，
    **不可直接外推到 Day 22**。列在這裡是基準線，不是結論。

expectations:                          ; Day 22 的腳本產出之前寫下
  整數偏好: >
    年齡群的「5 的倍數」比例，AI 會高於人工的 72%。
    理由不是 AI 笨，是 30/60/65/85 在預訓練語料裡就是退休這個題目的預設值。
  邊界命中: >
    六條約束多數格會是 0%。PRD 組可能在 `A_r < A_d` 上高一點——
    PRD-04 白紙黑字寫了 `A_c < A_r < A_d`，寫得出 on-point 的機會比較大。
  L1_vs_PRD: >
    規格細度對「挑什麼值」的影響，可能小於它對「寫不寫得出斷言」的影響。
    若成立，那是本篇最值得寫的一句：**規格管得住要驗什麼，管不住拿什麼去驗。**
  自我提醒: 猜對要自問有沒有在輸入裡洩漏，猜錯才是資料

goodhart:
  立場: >
    變異分數是體溫計，不是健康本身。拿它當 KPI，
    工程師會針對變異體特徵寫過擬合測試，分數立刻變好而盲區原封不動。
  本系列的證據: >
    Day 21 已經量到一次小的：把兩個盲區指給 AI 看，分數 85.7% → 100%，
    而輸入空間的缺口只補掉被點名的那一個。
    **照著指標做到滿分，跟把問題解決，是兩件事。**

execution_status:
  state: 已執行
  date: 2026-09-24
  runner: 作者本機
  input: generated/2026-09-22-scripts-matrix 的二十份腳本 + 兩份人寫的對照
  tool: tools/const_sampler.py（8 條 KAT）＋ rollup.py（逐格彙總）

  整數偏好:
    年齡是 5 的倍數:
      A-L1: 100%（n=93）
      B-L1: 99%（n=155）
      A-PRD: 80%（n=179）
      B-PRD: 95%（n=316）
      golden_v2（人寫）: 72%（n=82）
      test_checklist（人寫）: 97%（n=29）
    金額是一萬的倍數:
      A-L1: 57%　B-L1: 72%　A-PRD: 36%　B-PRD: 56%
      golden_v2（人寫）: 67%
    取值對照:
      AI: 1000、100、10000、50000 —— 好手算的數
      人: 30000、800000、**19391**、24000 —— 像真實情境的數
    假設驗證: >
      事前假設是 Round-Number Bias：年齡集中、金額集中整萬、邊界幾乎為零。
      **只對了三分之一。**
      年齡成立（AI 100%／99% 對人的 72%）；
      金額**反向**（AI 36–72% 對人的 67%，PRD 組比人還不整）；
      邊界完全推翻（見下）。
      更準的描述不是「AI 偏好整數」，是
      **「AI 挑好算的數，人挑像真的數」**——那個 19391 是人寫的，
      二十份 AI 產物裡一個都沒有。

  邊界命中:                            ; 沿用 Day 12 的 bva_checker，同格五份的案例池在一起
    A-L1: 年齡四條關係式**全部 0%**
    B-L1: 現齡<退休 67%、退休<壽命 33%、支出<=壽命 33%、支出>=退休 0%
    A-PRD: 支出>=退休 **100%**、其餘三條各 67%
    B-PRD: 支出<=壽命 **100%**、其餘三條各 67%
    golden_v2（人寫）: 退休<壽命 67%、大筆支出兩條各 33%
    test_checklist（人寫）: 年齡四條**全部 0%**
    假設驗證: >
      事前假設「邊界 ±1 幾乎為零」**被推翻**。
      規格寫明邊界之後，PRD 組的命中率**高於人寫的兩份對照**。
      A-PRD 出現 61、62 這種年齡，是為了構造相鄰年份逼出來的。

  key_finding_打到邊界不等於測對邊界: >
    `run-A-PRD-02` 同一個檔案裡：
    `test_prd_04_validation` 把「退休年齡 = 預期壽命」列進非法輸入清單，驗它會拋錯；
    `test_prd_05_lump_sum_inflation` 卻用同一組值去期待一個計算結果。
    **同一份產物、同一個邊界點，一條知道它非法，一條把它當合法用。**
    後者就是 Day 22 讓它在關 B 掛掉的那一條。
    人寫的 golden set 也踩了同一點（`def_b_equal`），但期望是「被拒絕」。
    **同一個座標，差別在期望值。**

  goodhart_實例: >
    `const_sampler` 對上述兩種情況一律報「命中 on-point」——
    **它量得到打不打得到，量不到期望對不對。**
    把邊界命中率當 KPI，AI 會準確地打到邊界，然後把期望寫反。
    這是本輪量出來的 Goodhart，不是論述出來的。
    原訂交付物「Goodhart 防線操作備忘錄」取消：
    通用建議（「不要拿指標當 KPI」）是廢話，一個量出來的實例比備忘錄有力。

  limitations:
    - 二十份腳本全部來自同一廠牌、同一組提示詞，n 小且不獨立
    - 基準情境的併入是推論（見 tool.known_limitation），會影響邊界命中的分母
    - 人寫的對照只有兩份，且都是作者本人寫的，沒有第三方基準
    - 「邊界命中率」量的是輸入座標，不看期望值——這正是本輪要示範的缺陷，不是 bug
