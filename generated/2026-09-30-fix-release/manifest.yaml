; 修復版上線：那支上線一年的計算機，照 PRD v1.2 修完。

experiment:
  id: 2026-09-30-fix-release
  day: 30-B
  question: >
    第一幕驗屍出四個缺陷（A、A'、B、C、D），第二幕裁決出 PRD v1.0 → v1.2。
    Python 實作 shadow/calc_fixed.py 經過 Day 14–28 全部的尺。
    **把它接回受測物那支 HTML，然後證明接回去的那一份跟 Python 是同一個東西。**

修復的內容:                            ; 每一項標出哪一天確認、依據哪條規格
  缺陷A_折現時點:
    改法: 折現與提領改期初，第一期對應退休當年（i 從 0 起）
    依據: PRD-02／PRD-03（2026-09-09 裁決）
    確認: Day 4 推導、Day 25 MR-04 在 legacy 上抓到（−28,813.50 → −0.00，比值 1.040000）
  缺陷A'_圖表夾0:
    改法: 圖表餘額逐項等於真實餘額，不夾 0；原版 374 行 `Math.max(0, remainingFund)` 移除
    依據: PRD-03／PRD-12（2026-09-15 新增）
    確認: Day 26 同一條斷言在 legacy 上紅（index 2：0.00 vs −8,503,876.79）
  缺陷B_壽命倒置:
    改法: 年齡順序校驗，`A_c < A_r < A_d` 不成立即拋錯；表單層阻斷
    依據: PRD-04
    確認: Day 3 驗屍；差分測試補的五組違規輸入之一
  缺陷C_大筆支出無上界:
    改法: 限定 `A_r ≤ A_e ≤ A_d`，區間外不計入，介面明示已忽略
    依據: PRD-05／PRD-11
    確認: Day 3 驗屍；Day 13 INV-2 換成界外位置會紅
  缺陷D_靜默補零:
    改法: `parseNumber` 不再 `|| 0`，空白與非數字回 NaN，表單層列出哪一欄不是數字
    依據: PRD-04
    確認: Day 13 指出 215 行在 Day 5 抽取邊界外，oracle 看不到；M09 即其原型
  v1.1_通膨基準年:
    改法: 勞保／勞退通膨指數改鎖各自請領年齡 A_p；其他收入與支出端仍鎖現齡 A_c
    依據: PRD-10（2026-09-13 缺口②）
    確認: 原版 312–317／353–358 行全部用 `yearsFromNow`（鎖 A_c）
  未改的:
    r_over_12: >
      年報酬率除以 12 當月利率。Day 3 判定「不是缺陷，是模型假設的簡化」，
      Day 9 閘門一裁決保留（RC-04）並明列代價（實測多算六十一萬）。
      **本輪不推翻那個裁決。** 變異體 M03 的方向是「比規格更正確」，golden v2 殺得掉它，
      代表測試已把這個簡化鎖成規格。
    /12_在v2裡的位置: 累積期本金與月存統一用 `r_monthly = r / 12`（PRD-01）

移植方式:
  方向: Python → JavaScript，與 Day 5 的機械式抽取相反
  規則: 一段對一段，順序不變、變數名不變、不做順手優化
  產物:
    - oracle/calc_fixed.js（純函式，無 DOM）
    - sut/進階退休規劃試算-v2.html（內嵌同一份 calculate，逐字相同；原版保留不動）
  HTML層的三處手術:
    - `parseNumber` 改回 NaN，加 `showError` 與欄位名清單（缺陷 D）
    - 計算段整段換成組 `p` → `calculate(p)` → 讀 `result`
    - 圖表：累積期用 r/12 算每年一點，提領期直接用 `balances_charted`，每個年齡一個點

驗收_四件事同時成立才准部署:
  一_舊快照紅在預期處:
    做法: tests/test_characterization.py 的 import 暫指 calc_fixed 跑一次
    預期: 紅。每一條紅都要能對應到上面「修復的內容」的某一項
    結果: >
      **27 failed / 27**。二十三組快照全紅、四條鎖缺陷測試全紅（2026-09-29 作者本機）。
      二十一組紅是缺陷 A（折現改期初，目標金額全變）；兩組壽命倒置的紅是缺陷 B（修復版拋錯）。
      鎖 C 與 A' 的幾組同時被兩個修復碰到。
      若有任何一組沒紅，代表修復沒碰到它。
  二_新規格測試綠:
    做法: tests/test_golden_v2.py
    結果: 23 passed（2026-09-29 作者本機）
  三_關係在新舊兩版符合預期:
    做法: tests/test_metamorphic.py，fixed 全綠、legacy 紅在 MR-04
    結果: >
      19 passed, 1 failed。紅的是 `test_mr04_funded_exactly_closes_the_gap[legacy]`，
      −28,813.50481278846，與 Day 25 完全相同（2026-09-29 作者本機）
  四_JS與Python逐位元對齊:
    做法: tools/diff_fixed.py，505 組（500 隨機 ＋ 5 違規）
    門檻: rel_tol=1e-9，沿用 2026-09-04，跑前定跑完不調
    結果: >
      **0 不符 / 2005 項**（沙箱實跑，node v22.23.2）。
      第一版 500 組全是合法輸入，拋錯路徑一組都沒走到——Day 28 那個病。
      補五組違規（年齡相等、壽命倒置、金額負值、請領年齡負值、大筆支出負值），
      五組兩邊同步拋錯。
    HTML內嵌與oracle逐字相同: 已驗（去縮排後字串相等）

M14:
  狀態: 決定早於 2026-09-09（PRD-10）與 09-13（缺口②）做過兩次，缺的是輸入涵蓋
  補的測試: tests/test_prd10_income_indexed.py
  關係: >
    通膨率上升時，**有收入**的目標金額增幅應**小於無收入**的增幅——
    收入若隨通膨調升會抵銷一部分。M14 讓收入固定，兩個增幅會相等。
    這正是 Day 25 說「需要領域洞察」的那條「通膨率與收入如何交互」的關係；
    洞察只有一句話。
  沙箱預跑:
    calc_fixed: "Δ有收入 14,621,896 < Δ無收入 18,277,370，成立"
    注入M14: "Δ有收入 18,277,370 = Δ無收入 18,277,370，不成立 → 殺掉"
    註: 相等得很精確——不隨通膨的收入在兩種通膨率下扣的是同一個常數
  正式數字: >
    pytest 2 passed。mr_audit_batch 逐條：
    `test_prd10_indexed_income_offsets_part_of_inflation` 殺掉 M14，**且只殺 M14**（1/14）；
    前置檢查那條碰不到任何變異體（預期內）。2026-09-29 作者本機，node v26.0.0。

expectations:                          ; 跑之前寫下，跑完不改
  對照實測: 五項全部與預期相符。一的紅是 27/27（預期「大面積」，實際全部）
  一: 舊快照大面積紅。不只鎖缺陷的八組，因為缺陷 A 改折現時點，每一組的目標金額都會變
  二: 全綠
  三: fixed 全綠，legacy 紅一條（MR-04），與 Day 25 相同
  四: 已實跑，0 不符
  M14: 殺掉。若沒殺掉，那條測試沒鎖住它，比殺掉更值得寫

limitations:
  - >
    **缺陷 D 的修復沒有任何一件驗收看得到。** `parseNumber` 在 HTML 215 行，
    2026-09-13 已記錄它在影子模型的抽取邊界外。差分比計算核心，快照／golden／關係也都是。
    v2 改了那一行，驗證只有手動（清空欄位、看提示）。這一列的證據等級與其他五列不同。
  - v2 只換了計算核心與三處介面手術，其餘 HTML 未動；介面層（表單、圖表元件）沒有自動化測試
  - 差分的 505 組是隨機抽樣加五組手選違規，不是窮舉；PRD-04 的其他違規形態（NaN 字串、空欄位）在 HTML 層處理，差分看不到
  - `/12` 保留是裁決，不是修復。代價（六十一萬）已明列，讀者自行判斷
  - 圖表在退休當年那一點的語意變了：原版畫累積期終值，v2 畫第一年提領後的期末餘額（PRD-03 索引對齊）。這是規格決定的，不是 bug，但畫面會不同
  - 部署與否是閘門 5 的決定，由作者做；本檔只列驗收條件

