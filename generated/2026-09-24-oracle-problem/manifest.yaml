; Oracle Problem：AI 寫的測試失敗時，是算錯答案還是餵錯輸入？
; 本檔在跑完之後寫。這一點與 Day 20–23 不同，理由記在 honesty 欄。

experiment:
  id: 2026-09-24-oracle-problem
  day: 24
  question: >
    Day 22 的二十份腳本有十二份在未修改的實作上就是紅的。
    紅的成因分成兩類：它算錯了期望值，還是它餵了規格禁止的輸入？
    前者是 Oracle Problem 的本體——沒有人能替它確認那個數字對不對。

input:
  source: generated/2026-09-22-scripts-matrix 的十二份關 B 紅產物
  tool: tools/failure_classifier.py（11 條 KAT）
  raw: raw/*.pytest.txt（每一份的原始 pytest 輸出，逐份存檔）
  result: failures.txt

honesty:
  manifest_寫在跑完之後: >
    Day 20–23 的 manifest 都在跑之前封存。本輪沒有——
    資料早在 Day 22 就存在 repo 裡，工具是為了讀它而寫的，
    不存在「跑之前」這個時點。
    代價是事前預期沒有封存效力，只能靠對話紀錄佐證（見 prediction）。
  prediction:
    誰: 助手
    何時: 提案 Day 24 要不要加量測時，於對話中寫下
    內容: >
      「如果『期望值算錯』佔大宗，那 Oracle Problem 就不是理論，
      是二十份產物裡量得出來的主要死因。」——預期它會佔大宗。
    結果: >
      **猜錯。** 原始計數只有 34%，去重後 50%，
      與「踩到非法輸入」幾乎各半，稱不上大宗。
      原本規劃的文章骨架（Oracle Problem 是主要死因）因此作廢，重寫。

method:
  分類規則:                            ; 只看 pytest --tb=line 的例外型別與訊息
    EXPECTED_WRONG: AssertionError 或 `assert ...` —— 期望值算錯
    ILLEGAL_INPUT: ValueError 且訊息為受測物 PRD-04 校驗的五句之一
    INTERFACE: TypeError／AttributeError／KeyError 等
    NEEDS_REVIEW: 其他 ValueError、沒見過的例外、解析不出型別
  去重規則: >
    同一份產物、同一行號、同一則訊息只計一次。
    一個壞掉的 fixture 會讓共用它的每一條測試都紅，
    原始計數把那算成好幾個錯誤——分母灌水，比例就不能看。
  兩道守衛:
    - 解析數與 pytest 自報的失敗數對不上 → 中止，不出具比例
    - 一條都解析不到 → 中止
    為什麼要兩道: >
      「總數為 0」抓得到全盤失效，抓不到「少抓了六成」，
      而後者才是這支工具第一版真正發生的事。

results:
  對帳: 38 / 38 全部相符，NEEDS_REVIEW 0 條
  分類:
    期望值算錯: 原始 13 條（34%）｜去重後 13 條（50%）
    踩到非法輸入: 原始 24 條（63%）｜去重後 12 條（46%）
    介面用錯: 原始 1 條（3%）｜去重後 1 條（4%）
    合計: 原始 38 條｜去重後 26 條
  去重削掉的是什麼:
    run-B-L1-04: >
      六條裡五條來自同一個 fixture 裡的同一個值
      `LumpSum(age=70, amount=-100_000.0)`。`base_params` 被五條介面測試共用，
      那一個負數讓它們一起死。**一個值，五條失敗。**
    run-B-pro-04: >
      六條全是 `retirement_age=60` 配 `life_expectancy=60`，
      同一個判斷錯誤在檔案裡重複寫了六次。

findings:
  一_兩類幾乎各半: >
    去重之後 50% 對 46%。「在能談答案對不對之前，
    有將近一半的失敗根本還沒走到那一步」——AI 連合法的輸入都還沒餵對，
    而 PRD-04 白紙黑字寫在它拿到的規格裡（PRD 組）。
  二_原始計數會說謊: >
    未去重時是 34% 對 63%，結論會變成「非法輸入佔六成」。
    去重之後翻成各半。**同一批資料，兩個分母，兩個相反的故事。**
  三_陣列長度那一組不是 Oracle Problem: >
    `assert 21 in (55, 56)` 在 run-B-L1-01／02／03 出現，
    run-B-L1-05 是同一件事的帶訊息版本——四份獨立產物算出同一個錯誤長度。
    但**四份全部是 L1 組（一句話）**，PRD 組無一犯此錯。
    所以這是「沒有規格就用欄位名猜」，屬 Day 22 的規格效應，
    不可當成 Oracle Problem 的證據。
  四_真正的 Oracle Problem 在 PRD 組: >
    run-A-pro-05 的 `assert 17837.019 == 29442.548 ± 0.001`：
    它拿到完整的十二條規格，手推出一個期望值，差了六成五。
    **規格完整仍推不出正確答案**——這才是 Oracle Problem 的樣子。
  五_紅的可以數綠的不能: >
    這 13 條算錯的期望值是**看得見的**，紅燈會亮。
    真正麻煩的是綠燈那些：Day 22 有一份腳本忠實性 100%、基準線全綠、
    單獨變異分數 0.0%——它的期望值沒有任何人驗證過，而且不會紅。
    **紅的可以數，綠的不能。**

tool_own_failures:                     ; 這支分類器自己壞了兩次，都記在檔頭
  第一次: >
    `--tb=line` 對「沒有附訊息的斷言」印的是 `assert a > b`，不是 `AssertionError`。
    漏掉這個形狀，十一條失敗被誤丟進 NEEDS_REVIEW。
  第二次: >
    例外在受測物裡拋出時，`--tb=line` 印的是 `shadow/calc_fixed.py` 的路徑，
    不是測試檔。第一版要求路徑含 `test_`，
    **把「踩到非法輸入」整類系統性濾掉**——而那正是本輪的對照組。
    當時報表印「期望值算錯 14%」，看起來完全合理。
  修正: >
    加對帳守衛（解析數 vs pytest 自報數）與 `--dump`（存原始輸出）。
    KAT 6 → 11 條，新增的五條全部取自這兩次失敗的真實形狀。

limitations:
  - 十二份產物來自同一廠牌、同一組提示詞，不是獨立樣本
  - 分類只看例外型別與訊息，不讀原始碼、不判斷「它為什麼那樣寫」
  - 去重鍵是（檔名、行號、訊息），同一個成因若寫在不同行仍會分開計數
  - 「綠燈的期望值沒人驗證」這句無法量化，只能舉 Day 22 那一份當存在性證明
