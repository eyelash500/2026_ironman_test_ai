; AI Scripts 對比矩陣：規格寫多細，測試就有多強？
; 本檔在跑之前寫完。跑完只准往 execution_status 補記，不准改 plan 與 pass_criteria。

experiment:
  id: 2026-09-22-scripts-matrix
  day: 22
  question: >
    同一個計算核心、同一個介面，只換規格的細度（一句話 vs 完整 PRD），
    AI 產出的 pytest 差多少？這個差距在換一臺模型之後還在不在？

design:
  type: 2 × 2 交叉
  factor_1:
    name: 規格細度
    levels:
      L1: 一句話（「幫這支退休金試算的計算核心寫 pytest 測試。」）
      PRD: PRD v1.2 的十二條條款全文
  factor_2:
    name: 模型
    levels:
      A: Gemini 3.1 Pro Preview（重型推理線的當前版）
      B: Gemini 3.8 Flash（輕量極速線的當前版）
    rationale: >
      同廠同介面，跨廠會把「介面／系統提示詞／預設溫度」一起換掉，
      量到的就不只是模型。
      **版本號 3.1 與 3.8 不在同一條軸上**——Pro 與 Flash 兩條產品線
      各自編號，所以這不是「差了七個世代」，是各取當前版。
      （助手一度把它讀成同一條世代軸，是誤讀，記在這裡。）
    what_it_can_show: >
      模型維度的作用是讓「AI 寫的測試」裡的 AI 是複數：
      **規格細度的效應換一臺模型還在不在。**
    what_it_cannot_show: >
      不排名、不評論哪一臺強。兩條產品線的訓練配方與資料截止日都不同，
      「Flash 分數低」無法歸因到「模型比較小」——那需要同線同版本的對照，
      本輪沒有。結論只能寫「換一臺差很多的模型，規格效應還在／不在」。
  cells: 4
  runs_per_cell: 5
  total_generations: 20
  why_no_middle: >
    原設計 4 level × 2 家 = 32 次，一天做不完。兩種砍法：
    砍模型維度（16 次），結論永遠可以被一句話推翻——「你量到的是那臺模型的脾氣」；
    砍中段 L2／L3（20 次），失去「寫到多細就夠了」這個實務建議，但主結論完整。
    判準是「第一批就算永遠沒有第二批，自己也能成立」。砍中段自足，砍模型不自足。
    L2／L3 各 3 次、單模型，留給第二批。

inputs:
  built_by: generated/2026-09-22-scripts-matrix/build_paste.py
  files:
    L1: _paste/paste-l1.txt   （1,848 字元、74 行）
    PRD: _paste/paste-prd.txt （3,008 字元、89 行）
  note: >
    **兩份輸入只准差在規格區塊。** 手寫兩份做不到——改了一邊忘了另一邊，
    自變數就從「規格細度」偷偷變成「指令用字」。
    所以共用段只寫一次由程式拼接，拼完自檢：
    挖掉規格區塊後兩份必須逐位元相同（實測 1,815 字元相同）。
    四格共用這兩份；模型是另一個維度，輸入不因模型而異。

  interface_only:
    what: interface.py —— LumpSum／Params／Result 的欄位與 calculate 的簽名，函式本體不給
    why: >
      Day 21 給了 calc_fixed.py 全文，因為那天的任務是「補測試」，非給不可。
      今天要量的是規格細度，**實作本身就是最細的規格**：
      兩組都附實作全文的話，L1 組直接讀程式碼寫測試，
      一句話與 PRD 的差距會被抹平，自變數失效。
      反過來完全不給介面也不行——不知道 Params 有哪些欄位，
      產物根本跑不起來，兩格都是「未達檢核」，矩陣塌成一欄。
      折衷是只給簽名。
    comments_stripped: >
      介面裡的中文註解只留符號對照（A_c／A_r／A_d／A_e／A_p／r／r_p／i），
      因為 PRD 用這套符號寫，不給對照會多出一層翻譯難度的混淆變因。
      其餘描述性註解（「今日幣值」「月額」）全部刪掉——
      那些是行為規格，留著等於偷渡給 L1 組。
      因此 `labor_insurance_pension` 是月額還是年額，PRD 組知道、L1 組要猜。
      **那個猜不猜得中，正是本輪要量的東西。**

  leak_scan:
    tool: tools/leak_scan.py（雙向，含五條 KAT）
    config: leak_config.py（跑之前定）
    result: 兩份皆通過
    accepted_hits:
      - 詞: 不得
        出現: 兩份的硬性約束 1、3、5
        判定: 可接受。限制的是產出形式，不透露任何計算行為。
      - 詞: 禁止 / Math.max
        出現: PRD 份的 PRD-03、PRD-04、PRD-12
        判定: >
          可接受但要記帳。這三句是 PRD v1.2 的本文，刪掉就不是那份規格了。
          但它們確實是「知道錯在哪之後回頭寫的規格」，
          [Day 11] 已認定為效度威脅（PRD v1 每條都長得像修正，
          規格洩漏了答案的方向）。
          **本輪不宣稱 PRD 組是乾淨對照組**；PRD 組的優勢有多少來自
          「規格寫得細」、多少來自「規格已經指著答案」，本輪分不開。
    caught_by_scan: >
      條款節末原本有一句「v1.1 → v1.2：新增 PRD-12，其餘一字不動」。
      那會告訴模型有版本史、而且 PRD-12 是後來補的——等於在十二條裡標了重點。
      掃描器抓出來的，不是事先想到的。已從擷取範圍剔除。

pass_criteria:                         ; 每一份產物依序過三關，與 Day 20／21 同
  gate_a_inspector:
    rule: tools/assert_inspector.py 掃過，忠實性 >= 0.8、無 EMPTY、無 VACUUM_ONLY
    fail_handling: >
      不進 harness，在矩陣記「未達檢核」而**不給分數**。
      交白卷與考不好不放進同一欄。

    amendment:                         ; 2026-09-23，A 格跑完之後
      what: >
        `EMPTY` 拆成 `EMPTY`（靜默變綠）與 `SKIPPED`（以 skip 宣告跳過）。
        只有前者計入閘門 3 失敗。`pytest.skip()` 藏在 if／except 裡的仍算 EMPTY。
      why_not_tuning:
        - >
          **矛盾在本檔凍結時就存在**：提示詞硬性約束第 4 條主動邀請 `pytest.skip`，
          而 pass_criteria 第三條懲罰 EMPTY。兩條同一天、跑之前寫的。
          這是協議缺陷，不是看完結果去改門檻。
        - >
          **修正規則無自由參數**：「pytest 報成 SKIPPED 的函式不是靜默變綠的函式」，
          只憑 pytest 的回傳語意就寫得出來，不需要看任何一份產物。
          對照被擋下的提案：「忠實性門檻改成 0.5」——0.5 是看著 56% 挑的，有自由參數，不放行。
        - >
          **關 C 會自我修正，關 A 不會**：塞滿 skip 的腳本，變異分數自然低，
          skip 掉的測試殺不掉任何東西。放進關 C 沒有風險，它在下一關就現形。
        - >
          十份 A 格產物的 EMPTY **百分之百是宣告式 skip**，
          真空白 0 條、條件式 0 條。門擋下的全是「我不知道，所以我標示出來」，
          而那正是 Day 13 立的「罪在不標示，不在推論」判為滿分的行為。
      residual_risk: >
        **助手是在已經看過「這樣改對 PRD 組有利」之後才提這個修正的。**
        三道防線如上，但不是密不透風。文章須照實寫出這一段，
        包括助手最初主張「判準不動只加診斷欄」、被作者質問之後翻案。
      scope: >
        只改這一處。忠實性門檻 0.8 與 VACUUM_ONLY 一個字未動。
        既有九個測試檔與 Day 21 三份產物無一使用 skip，
        本次修正不改動任何已發表的數字（已回歸驗證）。
      reporting: 兩組數字並列，正文用修正後，原判準寫在旁邊
      recorded_in: decisions.md（2026-09-23 / 閘門 3）
      b_cells: >
        B 格（Flash）的生成在本修正封存之後才進行，
        故「規則在看到 B 的資料之前就定好了」對 B 格完全成立。
  gate_b_baseline:
    rule: 未變異的 calc_fixed.py 上，該份測試必須全綠
    note: >
      模型看不到實作，精確期望值得自己從規格推。推錯就紅。
      **紅了不代改、不補跑**，記為未達檢核。
      這道門的偏誤要講明：要求全綠會鼓勵弱斷言（寫鬆一點比較安全），
      而弱斷言正好會被關 A 擋下。兩道門互為制衡，不是重複。
  gate_c_mutation:
    rule: 過了前兩關的，交給 harness 跑 Day 19 那 14 個領域變異體
    base: shadow/calc_fixed.py（與 Day 20／21 同一個基底，分數才可比）

metrics:
  primary: >
    **可評分率 = 過關 A + 關 B 的套數 / 該格生成套數。**
    排在變異分數前面。L1 格很可能整格未達檢核——那是結果，不是意外；
    可評分率讓那一格即使沒有分數也有數據，矩陣不會塌。
  secondary: 變異分數（只對過了前兩關的套計算，報 min／中位／max）
  error_by_model: >
    ERROR 次數兩臺模型分開報。輕量模型產出語法錯的機率較高，
    那些依 Day 18 的規則不入分數。不分開報的話，
    「B 分數低」可能只是「B 更常產出不能評分的東西」——那是兩個不同的結論。
  control: golden v2（人工）的 85.7% 放在矩陣旁當對照

settings_held_constant:              ; 兩臺共用，只有模型可以變
  thinking_level: High
  temperature: 1
  system_instructions: 空
  output_length: 65536
  note: >
    Flash 的預設是 Medium，本輪手動切到 High 與 A 格一致。
    不固定住的話，「B 分數低」會分不出是模型不同還是思考預算不同——
    那是可以免費避開的混淆變因。
    代價是本輪量的不是「Flash 在預設設定下的實務表現」，
    結論不得那樣寫。

isolation:
  - 每一輪全新對話，無記憶、無個人化
  - 六個工具開關全關（Structured outputs／Code execution／Function calling／
    Grounding with Google Search／Grounding with Google Maps／URL context）
  - 每一輪截圖設定面板，存 preflight-<格>-0N.png
  - 工具自述另開丟棄用對話問，存 preflight-discard.txt，僅為輔助證據
  - 每套腳本在獨立暫存目錄執行，pytest 帶 -p no:cacheprovider
  當天要現場確認: 兩臺的版本字串（模型會改版，不沿用本檔寫的名字）

expectations:                          ; 跑之前寫下的猜測，跑完不改
  note: >
    Day 20 的預期十四題只對六題，錯在「只看變異體不看案例」。
    Day 21 改成「先想 AI 手上有什麼資訊」之後對得比較準。這次沿用後者。
  可評分率: >
    L1 兩臺都低。它手上只有欄位名與型別，`target_fund` 該等於多少無從推起，
    要嘛寫 `assert result is not None`（關 A 擋下），
    要嘛自己編一個數字（關 B 擋下）。
    PRD 兩臺都明顯較高，但不會是 100%——PRD-02 的折現率規格沒寫明
    （[Day 15] 那份實作自己列為 GAP），推不出唯一解。
  變異分數: >
    過得了關的那幾套，分數不會比 golden v2 的 85.7% 高多少。
    M09（金額負值）與 M14（other_income 通膨）靠的是輸入空間，
    而 PRD-04、PRD-10 有寫——所以**這兩個反而可能被殺掉**，
    那會是 PRD 組唯一勝過人工 golden set 的地方。
  模型效應: >
    小於規格效應。若實測反過來（模型差異大於規格差異），
    那是本輪最值得寫的結果，也代表「把規格寫好」這個建議要打折。
  自我提醒: 猜對要自問有沒有在輸入裡洩漏，猜錯才是資料

execution_status:
  state: 已執行
  date: 2026-09-22 ～ 2026-09-23
  runner: 作者本機（Python 3.14.5、pytest 9.1.1）
  model_a: Gemini 3.1 Pro Preview（gemini-3.1-pro-preview）、Thinking High、六工具全關
  model_b: Gemini 3.8 Flash（gemini-3.8-flash）、Thinking High（手動由預設 Medium 切上）、六工具全關
  preflight: day22-preflight-A.png、day22-preflight-B.png（每臺一張）
  檔名說明: PRD 組的檔案存為 run-{A,B}-pro-0N.txt（當日命名，未回頭改）

  gate_a_inspector:                    ; 可評分率的第一道
    判準: 修正後（SKIPPED 不計入失敗，見 pass_criteria.amendment）
    A-L1: 1 / 5　（原判準 0 / 5）
    A-PRD: 5 / 5　（原判準 1 / 5）
    B-L1: 0 / 5　（原判準 0 / 5）
    B-PRD: 2 / 5　（原判準 1 / 5）
    EMPTY 的組成: >
      二十份產物的 EMPTY 判定裡，宣告式 skip 佔絕大多數，
      真正的空白（本體只有 pass）僅 B-L1-01 兩條，條件式 0 條。
      門擋下的幾乎全是「我不知道，所以我標示出來」——
      而那正是 Day 13 立的「罪在不標示，不在推論」判為滿分的行為。
    忠實性分佈:
      A-L1: min 17%、中位 67%、max 100%；測試函式 8–13 條
      A-PRD: min 89%、中位 100%、max 100%；測試函式 8–12 條
      B-L1: min 4%、中位 32%、max 65%；測試函式 19–27 條
      B-PRD: min 72%、中位 77%、max 95%；測試函式 21–27 條
    兩臺模型的失敗型態不同: >
      **同一句話的規格，兩臺選了相反的策略。**
      Pro 寫 8–13 條，不知道的就 skip 並寫明理由；
      Flash 寫 19–27 條，幾乎不 skip，改成大量弱斷言硬填，忠實性掉到 4%。
      兩格的可評分率都近乎 0，但只有一邊是誠實的——只看分數，這個差別完全消失。
      Flash 在兩個 level 都寫 2–3 倍的量、忠實性都比較低。

  gate_b_baseline:                     ; 未變異的 calc_fixed 上須全綠
    通過: A-L1-02、A-PRD-01、A-PRD-04、B-PRD-01
    不通過: A-PRD-02（1 敗）、A-PRD-03（2 敗）、A-PRD-05（4 敗）、B-PRD-04（6 敗）
    不代改不補跑: 是
    抽驗五條失敗測試的成因:
      踩 PRD-04 的非法輸入（4 條）: >
        A-PRD-02、A-PRD-05、B-PRD-04（兩條）把年齡區間壓成
        `A_r == A_d` 或 `A_c == A_r`，`calculate()` 直接拋 ValueError。
        動機一致：要手算期望值就想把提領期壓到最短，
        而最短的合法值是 2 年，最誘人的是 1 年，剛好非法。
        **PRD-04 白紙黑字就寫在它們拿到的規格裡。**
        與 Day 21 run-03 完全同一個錯，當時 n = 1，如今跨兩臺模型三份產物重現。
      規格沒寫清楚（1 條）: >
        A-PRD-03 把 `other_income=500` 當年額算，實作 `* 12` 當月額。
        PRD-10 寫了它的幣值基準與通膨鎖 A_c，**沒寫單位**；
        而欄位名 `other_income` 旁邊站著 labor_pension_monthly、
        monthly_investment、monthly_expense_today——三個都標了 monthly，只有它沒標。
        **同一份規格、同一臺模型，A-PRD-02 發現歧義標示出來跳過（關 B 過），
        A-PRD-03 沒發現就猜了（關 B 紅）。**
      未逐條驗屍: 13 條失敗中抽看 5 條，其餘未逐條分類

  gate_c_mutation:                     ; 基底 shadow/calc_fixed.py，14 個領域變異體
    兩種量法: >
      合計 = golden v2 + 該份腳本（貼近實務：新測試加在既有套件上）
      單獨 = 只跑該份腳本（--solo，2026-09-23 新增）
      加單獨版的理由：golden 自己就有 85.7%，
      一份什麼都沒加的腳本合計也會顯示 85.7%——那個數字大半是 golden 的功勞。
    results:
      A-L1-02:  合計 85.7%（M09、M14 活）｜單獨 **0.0%**（十四個全活）
      A-PRD-01: 合計 92.9%（M14 活）｜單獨 85.7%（M11、M14 活）
      A-PRD-04: 合計 92.9%（M14 活）｜單獨 85.7%（M11、M14 活）
      B-PRD-01: 合計 92.9%（M14 活）｜單獨 85.7%（M11、M14 活）
    對照: golden v2 單獨 = 85.7%（M09、M14 活），Day 20 量得

  key_findings:
    一_忠實性與殺傷力是兩把尺: >
      A-L1-02 **忠實性 100%、關 B 全綠、單獨變異分數 0.0%**。
      它的斷言嚴格得無可挑剔（`ls.age == 50`），但驗的是 Python 的 dataclass，
      改壞 calculate() 一行都不會紅。
      Day 16 的忠實性量的是「斷言嚴不嚴」，不是「在驗什麼」——這裡是它的實證。
    二_盲區由規格的形狀決定: >
      三份 PRD 組的單獨分數**完全相同（85.7%）、存活集合也完全相同（M11、M14）**。
      三次獨立生成、跨兩臺模型，結果一模一樣。
      **盲區不是隨機的。** 同一份規格產出的測試，洞開在同一個位置。
    三_從條款到分數的因果鏈: >
      M14 對所有人都活著，而它剛好要靠非零的 `other_income` 才踩得到——
      `other_income` 正是 PRD-10 沒寫清楚單位的那一個欄位。
      **規格沒寫清楚 → 測試不敢寫或寫錯 → 變異體活下來。**
      一條從條款接到分數的完整因果鏈，本輪最強的觀察。
    四_人與AI的盲區不重疊: >
      PRD 組單獨 85.7%，與人寫的 golden set 單獨 85.7% 相同，
      但活著的不是同一批：golden 活 M09、M14，PRD 組活 M11、M14。
      合起來 92.9%——**兩邊各補了對方的洞，只有 M14 兩邊都攔不住。**

  expectations_vs_result:
    可評分率: >
      猜中一半。事前寫「L1 兩臺都低」——對（1/5、0/5）；
      「PRD 兩臺都明顯較高但不會是 100%」——A-PRD 關 A 是 5/5，猜錯；
      但加上關 B 之後是 2/5，事前沒有預料到「模型會自己餵非法輸入」這種失敗。
    變異分數: >
      事前寫「過得了關的那幾套分數不會比 85.7% 高多少」「M09 與 M14 反而可能被殺」。
      前半猜中（單獨全是 85.7%）；後半一半：M09 被殺了，M14 沒有。
      沒有預料到的是 M11 會在三份裡全部存活。
    模型效應: 猜中。小於規格效應，且方向在兩臺上一致（1→5、0→2）
    沒猜到的: 單獨 0.0% 這個數字，以及三份 PRD 組存活集合完全一致

  secondary_analysis:                  ; 2026-09-23，跑完主流程之後才做
    what: >
      對二十份全部跑關 B，關 B 綠的再跑 `--solo`（不帶 golden）。
      **不進矩陣。** 矩陣的值仍由關 A + 關 B 決定，一個字未動。
    why: >
      主流程只有四份進得了關 C，A-L1 只有一份——
      「一句話的規格產出的測試殺傷力 0%」這個標題級的數字建立在單一資料點上，撐不住。
    hard_limit: >
      關 B 紅的產物**技術上無法計分**：`_assert_baseline` 直接中止。
      基準線紅的，變異結果沒有意義（Day 18 立的規矩，這裡照擋）。
      所以樣本仍有選擇性——選在「未變異時全綠」，不是隨機。

    關B全量結果: 二十份中**八份綠、十二份紅**（四成）
    關B紅的分佈:
      A-L1: 1 / 5（A-L1-04）
      A-PRD: 3 / 5（02、03、05）
      B-L1: **5 / 5 全紅**
      B-PRD: 3 / 5（02、03、04）

    忠實性與殺傷力的配對:               ; 八份可計分的
      A-L1-01: 忠實性 83%（關 A FAIL）｜單獨 0.0%
      A-L1-02: 忠實性 100%（關 A PASS）｜單獨 0.0%
      A-L1-03: 忠實性 67%（關 A FAIL）｜單獨 0.0%
      A-L1-05: 忠實性 56%（關 A FAIL）｜單獨 0.0%
      A-PRD-01: 忠實性 100%（關 A PASS）｜單獨 85.7%
      A-PRD-04: 忠實性 100%（關 A PASS）｜單獨 85.7%
      B-PRD-01: 忠實性 91%（關 A PASS）｜單獨 85.7%
      B-PRD-05: 忠實性 72%（關 A **FAIL**）｜單獨 **85.7%**

    finding_五_忠實性預測不了殺傷力: >
      **忠實性 100% 那一份（A-L1-02）殺傷力 0%；
      忠實性 72%、關 A 不及格那一份（B-PRD-05）殺傷力 85.7%，
      與三份關 A 滿分的完全相同。**
      八個點裡殺傷力只有兩個值（0 或 85.7%），
      決定它的是「L1 還是 PRD」，不是忠實性——
      忠實性從 56% 橫跨到 100%，對殺傷力沒有解釋力。
      Day 16 蓋的那把尺量的不是它想量的東西：
      它量「斷言嚴不嚴」，不量「在驗什麼」。
      這是本系列第一次拿真正的量測去驗自己的代理指標，**而代理指標沒過。**
      n = 8、單一廠牌、單一提示詞、且樣本選在關 B 綠——不可外推，標明為初步觀察。

    finding_六_誠實的沉默與努力的做錯: >
      同一句話的規格：
      Pro 不知道就 skip 並寫明理由 → 關 B 四份綠，殺傷力 0.0%；
      Flash 不 skip、寫 19–27 條硬填 → **關 B 五份全紅**（每份 2–6 條失敗），連分都打不了。
      **一個誠實地什麼都沒做，一個努力地做錯。
      兩邊都沒解決問題，但只有一邊看得出來自己沒解決。**

    A-L1 的 0.0%: n 由 1 提升為 4，四份全部 0.0%；可作為結論陳述，非單一觀察

  limitations:
