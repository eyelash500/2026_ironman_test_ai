; 把 Day 26 的人工 grep 自動化，然後拿它掃十份 AI 產物。

experiment:
  id: 2026-09-27-output-kinship
  day: 27
  question: >
    Day 26 的檢查是人工 grep：看到跨輸出的斷言，自己去翻實作那兩個欄位怎麼來的。
    143 條關係一條一條查得完嗎？能不能讓工具做？

  為什麼要自動化: >
    **不是因為慢。** grep 一次三十秒。
    是因為**人會略過它，而且略過的時候自我感覺良好**——
    Day 26 的作者連續判錯三次，每一次當下都覺得自己看懂了。
    工具不會覺得自己看懂了。

expectations:                          ; 誠實標註：本輪沒有事前封存的數字預測
  狀態: 未事前封存
  理由: >
    本輪不是生成實驗，是拿一支新工具去掃**已經存在**的產物。
    跑之前沒有對「會標記幾條」做過預測，所以不編一個回填。
    （沒有做的事情就不要說。）
  跑之前定的唯一一條: >
    **工具的驗收條件**：它必須抓到 Day 26 那條十份都寫的關係
    （`balances_charted == balances_raw`）。抓不到就是工具沒用，不是產物乾淨。
    這條在動手寫之前就講定了，寫成 KAT 第 1 組。

tool:
  file: tools/output_kinship.py（6 條 KAT）
  兩層設計:
    第一層_親緣表: >
      跑 200 組隨機合法輸入（種子 20260928，固定），
      逐對檢查輸出欄位之間的恆定關係。
    第二層_掃斷言: >
      逐條 `assert`，抽出兩邊碰到的 `(物件, 欄位)`。
      **只有在兩邊用同一個結果物件**、而且牽涉的欄位落在親緣表裡時才標記。
      跨執行的斷言（`res1.x` 對 `res2.y`）不標——那是蛻變關係的正常形狀。
  證據強度分兩級:
    IDENTITY: "`is` 判定，確鑿"
    EQUAL_VALUE_與_LINEAR: >
      在 200 組輸入上成立，**那是推論不是證明**。
      報表會標註並印出樣本數（Day 13：罪在不標示，不在推論）。
  守衛: >
    親緣表若一個 IDENTITY 都量不到就中止。
    受測物明知有一對是同一個 tuple（`calc_fixed.py` 154 與 156 行都是
    `balances_tuple`），量不到代表工具自己壞了——
    而壞掉的版本會安靜地回報「零命中」，看起來就像產物很乾淨。
    同 Day 24 的教訓：工具在什麼都沒做的時候必須閉嘴。

親緣表:                                ; 實測輸出
  balances_charted 與 balances_raw: IDENTITY
  projected_savings 與 retirement_gap 與 target_fund: >
    LINEAR（projected_savings == target_fund - retirement_gap）。
    對應 `calc_fixed.py` 153 行 `retirement_gap=target_fund - projected_savings`。

results:                               ; 2026-09-28 修正後的數字，更正經過見下方
  掃描對象: generated/2026-09-26-ai-metamorphic/ 的十份產物
  分母: 232 條 assert（143 個測試函式）
  標記: 14 條（6.0%），**十份全中**
  全部是 IDENTITY: 14 條全是 `balances_charted` 對 `balances_raw`
  LINEAR 命中: >
    **0 條。** 親緣表量到缺口與另外兩個欄位的線性關係，
    但沒有任何一份在**同一個結果物件內**寫出 `gap == target - savings`。
    那五份寫的是跨執行的差分版本，工具正確地沒有標記——
    與 2026-09-26 的撤回一致（那五條斷言的是正交性，不是恆真命題）。

  五種寫法:                            ; 跑之前沒想到的
    說明: 同一條恆綠斷言，AI 用了五種語法形式
    形式:
      - "res.balances_charted == res.balances_raw（10 條，直白）"
      - "list(r.balances_charted) == list(r.balances_raw)（包一層 list）"
      - "len(res.balances_charted) == len(res.balances_raw)（比長度）"
      - "res.balances_charted == pytest.approx(res.balances_raw)（包一層 approx）"
      - "for charted, raw in zip(...): assert charted == raw（拆成迴圈變數）"
    為什麼重要: >
      `len(x) == len(x)` 那條比的是同一個物件的長度跟自己的長度。
      而最後那種是**工具第一版看不見的**——見下方「工具自己的兩個錯」。

這支看不到什麼:                        ; 本日必報
  關係本身算錯: >
    Day 26 gate B 那條（固定年支出是年額、其他收入程式裡會再乘十二，
    兩邊各加二十萬實際差了十二倍）——
    那兩個欄位確實來自不同計算路徑，**結構上完全合格**。
    這支看不到，斷言檢核器也看不到（它給了那份 100% 忠實性）。
  結論: >
    **結構問題交給工具，語意問題留給人。**
    而語意那一半，目前沒有任何一把尺看得到。

工具自己的兩個錯:                      ; 2026-09-28 發現並修正，照實記
  錯一_漏掉一種搬運形狀:
    現象: >
      第一版的 `_refs()` 只認 `變數.欄位` 的形狀。
      `run-A-MR-03` L262–263 先用 `zip` 把兩個欄位拆成迴圈變數再比較，
      它看不見——報表顯示那個檔案「標記 1 條」，實際有 2 條。
    為什麼嚴重: 漏掉的方式是**安靜的**。沒有錯誤、沒有警告，只是一個小一點的數字
    修法: >
      補上別名追蹤（`a = res.f`、`a, b = res.f1, res.f2`、
      `for a, b in zip(res.f1, res.f2)`）。
      **但不把補語法當成解法**——補完 zip 還有生成式、還有先存進 list 再比，
      補到最後這支就變成它要取代的那個 grep，而且會因為
      「掃過了、沒命中」給出錯誤的安心。
    真正的解法: 讓第二層自報漏了幾處（見錯二）

  錯二_完備性守衛本身是壞的:
    現象: >
      初版守衛拿「程式碼裡提到親緣欄位的行數」去比「被標記的斷言數」。
      **那是兩組不同的行。**
      `run-A-MR-03` 前者是 L261、L262，後者是 L261、L263——
      兩個 2，一行都沒對上，報表卻顯示完全正常。
      十個檔案全部「相等」，守衛一次都沒響。
    為什麼嚴重: 一個從不觸發的守衛，跟壞掉的守衛長得一模一樣
    修法: >
      改成比對**行號集合**：剝掉註解與字串後同時提到一組親緣欄位的程式行，
      扣掉已標記的斷言行、扣掉真正產生別名綁定的行，剩下的報出來。
    驗收: >
      把別名處理關掉模擬第一版，守衛確實指出 L262。
      這件事寫成 **KAT 第 6 組**：餵一個工具解不開的形狀
      （`pairs = list(zip(...))` 後接生成式），
      它必須解不開、而且必須自己把那一行報出來。
      **守衛沒有被看過響一次，就等於沒有被驗收過。**

  數字異動: 標記 13 條 → 14 條（5.6% → 6.0%）；KAT 5 組 → 6 組

已撤回的說法:                          ; 寫進文章草稿、發表前撤掉
  原句: >
    「其中 3 條是人工 grep 會漏掉的：昨天搜的是
    `balances_charted.*balances_raw` 這種字串樣式，
    包在 list()／len()／approx() 裡的不一定中。」
  為什麼是假的:
    - >
      **那個樣式抓得到全部。** 實測 `grep "balances_charted.*balances_raw"`
      命中 22 處，14 條斷言一條不漏——因為那三種寫法的字串裡
      照樣是 `balances_charted` 在前、`balances_raw` 在後。
    - >
      **而且 Day 26 根本沒跑過那個樣式。** 當天實際跑的是
      `grep -c "balances_charted"`，那個更寬，一樣全中。
  試過的補救與為什麼不採用: >
    曾考慮把文章改寫成「昨天搜的是某個更死板的樣式」，讓邏輯自洽。
    實測兩個候選樣式：
      精確字串 `res.balances_charted == res.balances_raw` → 漏 10 條
      `balances_charted ==.*balances_raw`                → 漏 2 條
    **都湊不出 3。** 要湊出 3 就得繼續調樣式直到數字對上，
    那是為了讓結論成立去動量尺（Day 23 整篇在講這件事）。不採用。
  改成什麼: >
    真正的事實比那個說法強：**昨天漏掉的不是某幾條，是只查了一對欄位。**
    grep 全抓到了；問題是我從來沒問過「這支程式還有哪些欄位對是親戚」。
    親緣表一跑就多冒出一組（缺口／目標金額／資產），那組昨天連想都沒想過。
    所以工具的價值不是找得比較全，是**你不必先知道要找什麼**。

limitations:
  - >
    **親緣表不是完備的。** 它只查三種形式：兩兩「同一個物件」、兩兩「值恆等」、
    以及三個純量之間的加減。沒查的有：tuple 對純量的關係、非線性關係
    （比值、乘積）、四個以上欄位的關係、tuple 內部逐元素的關係。
    **它沒查，而且不會告訴你它沒查**——這一點與第二層不同，第二層至少會自報。
    草稿一度把第一層寫成「完備」，那是一篇通篇在講「不要宣稱沒有的完備性」的
    文章自己宣稱了沒有的完備性，發表前改掉。
  - >
    「標記」不等於「沒用」，等於**它的兩邊在實作上是親戚**——
    那條斷言約束的東西比它的長相少。逐條仍然要人看。
  - >
    親緣表是對**這一個實作**量的。同一條斷言換一個實作就不是親戚了：
    在 legacy 上 `raw` 與 `charted` 是兩條各自累積的 list，
    同一條斷言抓得到被夾成 0 的負餘額（Day 26 實測）。
  - EQUAL_VALUE 與 LINEAR 是 200 組輸入上的推論，不是證明
  - >
    5.6% 這個比率只對這十份產物、這一個受測物成立。
    不同的輸出欄位設計（例如沒有兩個欄位共用同一個物件的程式）會得到完全不同的數字。

