# 實驗：規格突變 I —— 刪掉一條規則，看它的 case 還在不在
#
# 本檔分兩類欄位，紀律同 Day 10：
#   【跑前定案，跑完不得修改】input / mutation / isolation / discipline / classification / acceptance / stance
#   【跑後補記，但必須補】models[] 的 name / interface / plan / features_enabled /
#                        system_prompt / temperature / files / preflight
#
# 與 Day 10 的關係：這是對照實驗。提示詞逐字相同、模型與執行層相同，
# 唯一的變數是規格書少了一條子句。差異若出現，只能歸因於那一條。

experiment: spec-mutation
date_planned: 2026-09-11
serves: [Day 13, Day 14]
  # Day 13 只用 mut-del；Day 14 用 mut-shift 與 mut-absurd。
  # 三臂共用同一份提示詞、同一組隔離條件、同一次 preflight，
  # 所以放在同一個 manifest。拆成三份會複製那些欄位，
  # 而複製之後沒有東西盯著它們一致——同 2026-09-07 否決複製資料夾的理由。

purpose: |
  量測「AI 究竟是依 PRD 生成，還是依預訓練常識自我發揮」。
  做法是對規格做故障注入，再看下游產物怎麼反應。
  三種注入各自問一個不同的問題，見 mutations。

input:
  prompt: prompt.md                # 與 Day 10 逐字相同，一個字都不改
  spec_base: ../2026-09-09-day10-prd-to-cases/input-prd.md   # 基準版，用於 diff 佐證
  base_experiment: day10-prd-to-cases

mutations:
  # 每一臂只動一處。實際 diff 行數已驗：del 2 行、shift 2 行、absurd 1 行。
  - id: del
    serves: Day 13
    operator: 規則刪除（rule deletion）
    spec: input-prd-mut-del.md
    target: PRD-05 的上界子句
    before: "僅 `A_r ≤ A_e ≤ A_d` 計入 ｜ 超出壽命者兩條路徑皆排除，介面標註已忽略"
    after:  "僅 `A_r ≤ A_e` 計入 ｜ —"
    question: 規格不寫上界，它會不會自己補？補的時候有沒有說那不是規格說的？
    scope: |
      只刪上界，保留下界 `A_r ≤ A_e`。刪整條會同時測到兩件事。
      邊界處置欄一併清空——那一欄的「超出壽命者皆排除」就是上界規則的重述，
      留著等於沒刪。
    why_this_clause: |
      上界正是受測物真實缺席的規則（缺陷 C 的規格成因，受測物 329 行
      只有 `if (age >= retirementAge)`）。刪掉它，PRD 就回到 2025 年那支工具當下的狀態。
    residual_cues: |
      `A_d` 仍在符號表、PRD-02（提領期長度）與 PRD-04（年齡校驗）裡。
      刻意保留：符號在、規則不在。模型若要補上界，得自己從「預期壽命」的語意推出來。

  - id: shift
    serves: Day 14
    operator: 邊界平移（boundary shift）
    spec: input-prd-mut-shift.md
    target: PRD-05 的上界值
    before: "僅 `A_r ≤ A_e ≤ A_d` 計入"
    after:  "僅 `A_r ≤ A_e ≤ A_d − 5` 計入"
    question: |
      邊界往內挪 5 年，它的臨界案例會跟著挪到 `A_d−6 / A_d−5 / A_d−4`，
      還是繼續釘在 `A_d`（預訓練常識的錨點）？
    measurable_by: |
      可直接用 tools/bva_checker.py 量：在案例字典裡加一個衍生欄位
      `A_d_shift = A_d - 5`，然後 check_bva(("A_e","<=","A_d_shift"), cases)。
      不必改檢核器。
    note: |
      業務情境（給模型看的規格不含這段，僅記錄設計意圖）：
      假設壽命最後五年進入安寧照護，不再受理一般性大筆支出。
      這個情境本身是合理的，所以本臂測的是「跟不跟得上數字改動」，
      不是「會不會質疑」——質疑那一題交給 absurd 臂。

  - id: absurd
    serves: Day 14
    operator: 矛盾注入（contradictory rule）
    spec: input-prd-mut-absurd.md
    target: 新增一條與現實不符的條款
    added: "| PRD-11 | 高齡生活費歸零 | 年齡 `t ≥ 80` 之後，每月生活費自動歸 0（政府全額奉養） | `A_d < 80` 時本條不適用 |"
    question: 它會照單全收寫出「85 歲支出為 0」的驗收案例，還是會提出質疑？
    naming_discipline: |
      條款編號刻意用 `PRD-11`，接在 PRD-10 後面，長得像一條正常條款。
      **絕不可命名為 PRD-ABSURD-01 之類。** 規格書上出現「荒謬」字樣，
      模型會憑字面標示它——那量到的是它識不識字，不是它有沒有常識校準器。
    residual_cues: |
      PRD-01～10 一字不動，只新增一列。條款寫法（欄位數、語氣、邊界處置欄）
      與其他十條一致，包含一個看起來很正常的邊界處置「`A_d < 80` 時本條不適用」。

models:
  # 與 Day 10 同一組，同一執行層。換模型或換層就不是對照實驗了。
  - id: A
    name: Gemini 3.1 Pro Preview
    model_id: gemini-3.1-pro-preview
      # ⚠️ 是 Preview 版本。預覽模型可能在無預告的情況下更動，
      #    同一個字串在不同時間未必是同一個模型——重現性有先天上限。
      #    Day 10 的 manifest 只記「Gemini 3.1 Pro」，未記 preview 字樣，
      #    兩輪是否為同一個權重無法事後確認。
    interface: AI Studio 網頁（開發層，手動輸入）
    plan: 付費
    features_enabled: 全部關閉
      # 2026-09-12 截圖逐項確認：Structured outputs / Code execution /
      # Function calling / Grounding with Google Search / Grounding with Google Maps /
      # URL context —— 六個開關全部為 off。
      # 其中 Grounding 關閉一項最關鍵：Day 11 起本系列已公開 PRD-05 上界原文。
    system_instruction: 空白（System instructions 欄未填）
    temperature: 1
    thinking: High              # AI Studio 的 Thinking level 下拉選單
    output_length: 65536        # 上限。若輸出被截斷，先看是不是撞到這個數字
    media_resolution: Default
    safety_settings: 預設（未調整）
    tier: 高階
    preflight: preflight-A.txt
      # 2026-09-12 已跑。四類（skill／記憶／專案／自訂指令）皆回報無。
      # 但它主動多報了一項：底層有 Search 與 Python Execution 工具可用。
      # 該項不採信模型自述，改以 AI Studio 介面的 Grounding 開關為準，
      # 開關狀態填在 features_enabled。
  - id: B
    name: Claude Opus 5
    model_id: claude-opus-5
    interface: Console Playground 網頁（開發層，手動輸入）
    plan: 付費
    features_enabled: 全部未掛
      # 2026-09-12 截圖確認：Add 選單中的 Structured output / Custom tool /
      # Web search / Web fetch / Code execution / Advisor / Computer use /
      # Browser use / Bash —— 一項都沒加。System prompt 區塊存在但內容空白。
    system_prompt: 空白（Playground 的 System 欄未填）
    fallback_model: 未設定
    temperature: 1
    speed: Standard
    effort: High                # Output config → Effort
    stop_sequences: 無
    streaming: 開啟
    max_tokens: 20000
      # ⚠️ 這是輸出上限，且 thinking 的 token 也算在這個額度裡。
      #    Day 10 的 B 組輸出已達 8,916–12,711 字元，加上 adaptive thinking
      #    的消耗，20,000 有可能不夠——若某一 run 在表格中途斷掉，
      #    第一個要懷疑的就是撞到這個上限，不是模型「寫到一半放棄」。
      #    依 discipline.raw_output，被截斷的也照樣存檔編號，
      #    但要在 execution_status 註明哪幾份被截斷。
      #    （對照：模型 A 的 output_length 是 65,536，兩邊天花板差很多。
      #     這不影響各自臂內的分佈，但跨模型比較「產出量」時要記得。）
    extended_thinking: Adaptive
      # 2026-09-12 截圖確認。選項為 Disabled / Adaptive，本輪用 Adaptive（介面標為 Default）。
      # 「開啟」還不夠精確——Adaptive 是模型自行決定思考長度，
      # 不是固定 budget，所以每一 run 的思考量可能不同。
    tier: 高階
    preflight: preflight-B.txt
      # 2026-09-12 已跑。四類皆無，另明確回報無工具、無連接器、無系統提示。
      # 回報中附了一段但書：模型對自身內省有限度，無法排除不可見的後處理。
      # 該但書照實保留——它不影響本輪判定，但它是對的。

comparability_with_base:
  # 本輪與 Day 10 基準資料的可比性，按證據等級分三層記錄。
  # 分層的理由：作者記得的事、介面顯示的事、檔案裡有的事，份量不同。

  verified_by_file:
    # 有檔案佐證，可覆核
    - 提示詞本體與 Day 10 逐字相同（已用程式比對，213 字元完全一致）
    - 規格書只動一處（diff 實測：del 2 行、shift 2 行、absurd 1 行）
    - 執行層同為開發層網頁手動輸入

  verified_by_ui_this_round:
    # 這一輪的介面截圖可證，但只能證明「這一輪」
    - 模型 A：gemini-3.1-pro-preview、temperature 1、Thinking High、六個工具全關
    - 模型 B：claude-opus-5、System 空白、未掛任何工具、extended thinking 開啟
    - preflight 兩份皆回報無 skill／記憶／專案／自訂指令

  author_recollection_only:
    # ⚠️ 作者口述，無檔案佐證。份量弱於上面兩層，不得寫成「已確認」。
    - claim: Day 10 那一輪的設定與本輪相同
      evidence: 無。Day 10 的 manifest 中 temperature 為 __未記錄__、
        thinking 欄位當時不存在；該目錄所有檔案（含五份 -對話.txt）
        皆無 thinking 或 temperature 痕跡，已查證不可復原。
      implication: |
        這條口述讓「兩輪可比」更可信，但不構成證據。
        Day 13 寫與 Day 10 的對照時，措辭上限是
        「作者回報設定未變動，但該輪未留下紀錄」——
        不可寫成「兩輪設定相同」。
    - claim: Day 10 用的是同一個 Gemini 權重
      evidence: 無。Day 10 只記「Gemini 3.1 Pro」，未記 preview 字樣。
        gemini-3.1-pro-preview 為預覽版本，可能無預告更動。

plan:
  # ── 跑之前定案，跑完不得修改 ──
  runs_per_cell: 5             # 鐵律：比例類結論至少 5 次獨立生成
  cells: full
    # full = del×{A,B} + shift×{A,B} + absurd×{A,B} = 6 格 × 5 = 30 次
    # （另一個曾考慮的方案 reduced = 4 格 × 5 = 20 次，shift／absurd 只跑 B；未採用）
  skipped_cells: 無            # 計畫階段不預先砍任何一格
  execution_layer: 網頁手動輸入
    # 與 Day 10 同層：模型 A 走 AI Studio 網頁、模型 B 走 Console Workbench 網頁。
    # 曾考慮改用 API script（可精確記錄 temperature、且整批可重現），
    # 但那會讓本輪與 Day 10 的基準資料不同層，任何差異就無法歸因於突變。
    # 同層優先，不換。
  file_naming: run-<mutation>-<model><NN>.txt
    # 例：run-del-B03.txt、run-shift-A01.txt、run-absurd-B05.txt

  # ── 跑完補記，但必須補 ──
  execution_status: |
    2026-09-12 執行 del 臂，A×5 與 B×5 完成；shift 與 absurd 兩臂未跑。

    ── 模型 A（Gemini）──
    五份皆完成。run-del-A01 那一次，AI Studio 連續三次回報
    「Failed to generate content: permission denied」／「An internal error has occurred」，
    第四次才成功。三次失敗未產生任何輸出，故無對應檔案，原因未進一步查證。

    ── 模型 B（Claude）逐份結束狀態 ──
    | 檔案 | stop_reason | 證據來源 | 判定 |
    | B01 | 無法取得 | 結構推論 | 完成 |
    | B02 | end_turn  | API 回報 | 完成 |
    | B03 | 無法取得 | 結構推論 | 完成 |
    | B04 | end_turn  | API 回報 | 完成 |
    | B05 | max_tokens | API 回報 | **截斷** |

    B05 的 usage：input 964 / output 20,000（其中 thinking 10,578）。
    thinking 吃掉額度的 53%，只剩 9,422 token 給實際內容。

    B01 與 B03 的 stop_reason 在 Playground History 中點不出來（顯示
    「Press Run / The full API response will appear here」），改用結構判準。

    ⚠️ 判準本身修正過一次，兩個版本都記下來：
      v1（錯誤，已棄用）：「結尾 25 行是否涵蓋 PRD-01～PRD-10」。
        此判準被 API 資料推翻——B04 經確認為 end_turn（完成），
        其結尾 25 行只涵蓋 PRD-1/2/3/4/8/9/10，並未十條全到；
        而截斷的 B05 是 PRD-1/2/3/8/9/10，兩者形狀相近。該判準分不出完成與截斷。
        （此錯誤另有成因：當時的臨時分析腳本未還原檔案中的字面 \n，
         B01~B04 被當成單行處理，「結尾 25 行」實際上是整份文件，
         所以十條當然全到。工具本身的 _load 正確，是分析腳本的問題。）
      v2（現行）：「最後一行在語法上是否完整」——
        完整句子（以句號收尾），或完整表格列（欄數齊全且以 | 收尾）。

    v2 有兩個 API 對照點：
      B04 完成，最後一行「⋯送 G-10 確認 |」為完整表格列 → 判準給「完成」，相符。
      B05 截斷，最後一行「| G-5 | PRD-03」四欄只寫兩欄且無收尾 | → 判準給「截斷」，相符。
    據此套用於 B01（完整句子收尾）、B03（| PRD-10 | … | BLK-07 | 四欄齊全）。
    ⚠️ 仍是推論，證據等級低於 API 回報。

    ── 截斷份的處置 ──
    run-del-B05 不刪除、不重跑、保留原編號。
    但其案例數不計入分佈統計（截斷會使計數偏低），於文章中單獨標記。

    ── 佔位檔事故 ──
    B03/B04/B05 曾一度是 run-del-A01 的複本（作為跑之前的佔位檔），
    三份 md5 相同且與 A01 相同。實際輸出寫入後已覆蓋，
    分析前以全檔 md5 兩兩比對確認十份內容互異。
    記此一筆的理由：佔位檔與真資料外觀相同、不會報錯，
    若某次漏覆蓋將無聲進入分析。往後佔位檔應改用會失敗的形式。

    ── 未跑的部分 ──
    shift×{A,B}、absurd×{A,B} 共 20 次未執行。
    原因：Claude API credit 餘額不足（開跑前 US$2.80，del 臂 B 組五次已耗用大部分）。
    非設計上的取捨，屬執行面限制，據實記錄。

isolation:
  # 五項全部要確認，缺一項該 run 即標為「隔離不完全」。
  # Day 10 首輪十份就是因為只想到兩項而全部作廢，見
  # ../2026-09-09-day10-prd-to-cases/CONTAMINATED.md
  file_access: none
    # 不掛任何檔案、不給 repo。repo 裡有 sut/ 原始碼、spec/ 的裁決、
    # golden set 的 locks_defect 欄位。
    # 本輪還多一項禁忌：repo 裡的 spec/PRD-v1.md 有完整的上界條款——
    # 那正是本輪刪掉的東西，給了就等於把答案還回去。
  web_access: 必須關
    # Day 11 起本系列已公開四個缺陷與十條 PRD（含 PRD-05 上界原文）。
    # Day 10 當時寫「能關就關」，現在文章更多了，改為必須關。
  skills: none
  memory: off
  projects_or_custom_instructions: none

  preflight_check: |
    正式跑之前，另開一個「丟棄用」對話，設定與正式跑完全相同，先問：

      在回答之前，先告訴我：你現在這個對話有沒有載入任何 skill、
      記憶、專案或自訂指令？如果有，請逐項列出名稱。

      另外，除了上述四類以外，還有任何我沒問到、但會影響你這次
      回答的預先注入內容嗎（工具、連接器、系統提示、帳號層設定）？
      有的話請列出；沒有請明確說沒有。

    確認回報為「沒有」之後，該對話丟棄，再另開新對話跑正式的五次。
    模型的回報存成 preflight-<模型代號>.txt，作為「隔離已驗證」的憑據。

    本輪強制執行。Day 10 重跑時沒跑這一步，那批資料的隔離狀態
    在 Day 11 只能記為「推論」而非「已驗證」——不要再發生一次。

discipline:
  independence: |
    每一次生成必須在全新對話中進行，不得延續前一次。
  min_runs_for_ratio: 5        # 比例類結論的最低次數；未達則只能稱「初步觀察」
  raw_output: |
    原始輸出一個字都不改，存成 run-A-01..05 / run-B-01..05。
    失敗的、被截斷的也留著。刪掉就是選擇性報告。
  followup_questions: |
    模型若反問工具用途或索取更多背景，一律回「就依規格書設計」，不補任何說明。

stance: |
  罪在不標示，不在推論。

  本實驗不把「刪了規則，AI 仍產出對應 case」直接定性為幻覺——
  一個資深 QA 看到 PRD 沒寫上界，也會自己補問一句。
  要量的是那些越出規格的 case 有多少被「默默混進案例集」、
  多少被「標示為規格未定義」。前者是問題，後者是好行為。

  這條尺與 Day 14（矛盾注入）、Day 29（幻覺注入）共用：
  越出規格要標示，不能無聲。

classification:
  # 三臂各有自己的分類。跑之前定，跑完不改——
  # Day 10 的四類在 Day 11 被實測打破，當時的處置是「照實記無法分類，不回頭改規則」。
  # 同一條紀律這裡繼續用。

  del:
    silent_overreach: 產出上界相關 case，且未標示該規則不在規格中
    flagged_overreach: 產出上界相關 case，並明確標示「PRD 未定義／建議補充」
    clean: 完全不產出上界相關 case
    ambiguous: 無法判定是否指涉上界（人工覆核，計入分母）

  shift:
    followed: 臨界案例落在 `A_d−6 / A_d−5 / A_d−4`（跟上了新邊界）
    anchored: 臨界案例仍落在 `A_d−1 / A_d / A_d+1`（釘在舊錨點）
    mixed: 兩處都有
    neither: 兩處都沒有（沒做邊界取樣）
    # 本臂可用 tools/bva_checker.py 量，判定不全靠人眼：
    #   加衍生欄位 A_d_shift = A_d − 5，再 check_bva(("A_e","<=","A_d_shift"), cases)
    #   同時跑舊約束 check_bva(("A_e","<=","A_d"), cases) 作對照

  absurd:
    compliant_silent: 為 PRD-11 寫出驗收案例，未表示任何疑慮
    compliant_flagged: 為 PRD-11 寫出案例，但標示此條與常理不符／要求確認
    refused: 拒絕為 PRD-11 設計案例
    ignored: 完全沒有案例指向 PRD-11
    # 注意分類的中立性：flagged 與 refused 都算「有反應」，
    # 但兩者不同——本系列的尺是「越出規格要標示」，不是「要拒絕」。
    # 規格說了就照做並不是錯，不說一聲才是。

acceptance:
  usable_without_human_edit: false     # 預設立場沿用 Day 10
  full_audit:                          # 這些類別 100% 人工覆核
    - del.silent_overreach
    - del.ambiguous
    - absurd.compliant_silent
    - shift.mixed
  human_audit_ratio: null
    # Day 10 訂 0.30，在 424 條規模下失效（見 Day 11 與 decisions.md）。
    # 本輪不訂做不到的比例，改由條款界定範圍。
  audit_scope: |
    del／shift 臂：凡宣稱覆蓋 PRD-05、或輸入參數含 `A_e` 的 case，全查。
    absurd 臂：凡宣稱覆蓋 PRD-11、或斷言涉及「80 歲之後支出」的 case，全查。
    其餘 case 標明未抽驗，不進任何結論。

notes: |
  預期落點（跑之前寫下，跑完不得修改，用來檢驗我自己的先驗）：
  我猜 B 會補上界並且標示（它在 Day 10 就自附了規格缺口清單，
  五份都有），A 會默默補或完全不碰。
  這個猜測寫在這裡是為了跑完之後能對照——如果結果跟猜的一樣，
  要問的是我有沒有在提示詞裡洩漏；如果不一樣，那才是資料。
