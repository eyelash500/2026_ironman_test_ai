; 換一個問法：要關係，不要答案。
; 本檔在跑之前寫完。跑完只准往 execution_status 補記，不准改 expectations。

experiment:
  id: 2026-09-26-ai-metamorphic
  day: 26
  question: >
    Day 24 量到：AI 寫測試時，那個期望值的唯一來源是它自己，而人核不動。
    如果改成要它寫**蛻變關係**——不需要期望值的那種——產出會變成什麼？

design:
  變的只有一樣: >
    介面、規格、進入點的硬性約束，全部沿用 2026-09-22-scripts-matrix 的 PRD 組。
    `build_paste.py` 直接從那份貼上檔抽出「介面」與「規格」兩段原樣沿用，
    不重打（手打會讓變因不只一個），並自檢兩段與 Day 22 逐位元相同。
    **只換「要它交出什麼」**：
      Day 22　照規格寫 pytest　　→ 它必須自己算出一個期望值
      Day 26　照規格寫蛻變測試　→ 它必須自己想出一條關係
  不跑一句話組: >
    L1 組在 Day 22 已證明交不出能評分的東西（可評分率 0/5、單獨變異分數 0%）。
    本輪只跑 PRD 組，省一半。
  cells: PRD 組 × 兩臺模型（Gemini 3.1 Pro Preview／Gemini 3.8 Flash）
  runs_per_cell: 5
  total_generations: 10
  settings: Thinking High、temperature 1、六個工具全關（與 Day 22 相同）

  示範例子的處理:
    問題: >
      要教它「蛻變測試長什麼樣」就得舉例，但第一版舉的兩個例子
      （金額同乘 k、壽命延長）**剛好就是作者 Day 25 寫的 MR-01 與 MR-02**。
      那樣量到的會是「它會不會照抄」，不是「它想不想得到」。
    處置: >
      改用與本題領域無關的例子（`sort()` 的順序不變性與長度關係），
      只說明形狀，不給任何退休金相關的關係。
      **本題的關係要它自己從規格想出來。**
    掃描: 「齊次」「單調」「自我一致」「支出配置」等詞列入 must_not，實測 0 命中

  不指定條數: >
    提示詞沒有說「要寫幾條關係」。指定數量會逼它湊數，
    那樣量到的是「它能生出幾條」，不是「它想得到幾條」。
    代價：可能只寫兩三條，資料會薄。
    Day 22 同樣沒指定，產出是 8–27 條測試函式，風險可接受。

  要求逐條註解: >
    硬性約束第 6 條要求每條關係前面寫一句「把輸入怎麼變、輸出該有什麼關係、為什麼」。
    這條是為了稽核——沒有它，讀不出它想表達的關係是什麼，
    只能從程式碼反推，而反推就是在替它補完意圖。

  leak_scan:
    tool: tools/leak_scan.py
    config: leak_config.py（跑之前定）
    result: 通過
    accepted_hits: >
      「不得」（硬性約束的措辭）、「禁止」「Math.max」
      （PRD-03／04／12 的本文，Day 11 已認定為效度威脅，沿用 Day 22 的判定）

pass_criteria:                         ; 與 Day 22 同一條流水線
  gate_a_inspector: tools/assert_inspector.py，忠實性 >= 0.8、無 EMPTY、無 VACUUM_ONLY
  gate_b_baseline: 未變異的 calc_fixed 上必須全綠，紅的不代改不補跑
  gate_c_mutation: >
    過了前兩關的，交給 harness 跑十四個領域變異體。
    **合計與單獨都要跑**（--solo），理由同 Day 22：
    合計會被 golden 的 85.7% 灌滿，看不出這份腳本自己的殺傷力。
  gate_d_relation_audit: >
    **本輪新增。** 用 Day 25 的 `tools/mr_audit.py` 的同一把尺，
    逐條看它提的每一條關係殺得掉幾個變異體：
    殺 0 個的是廢話。這一關不影響分數，是給 Day 27 的稽核用的。

metrics:
  期望值算錯: >
    Day 24 量到 13 條（去重後 50%）。
    本輪**結構上應該歸零**——提示詞禁止寫死期望值。
    這是由設計保證的，不是發現，所以它不是主要指標，是檢查提示詞有沒有生效。
  可評分率: Day 22 的 PRD 組是 2/5（Pro）與 1/5（Flash）
  單獨變異分數: Day 22 的 PRD 組是 85.7%；作者手寫的四條關係是 14.3%
  關係品質: 提了幾條、成立幾條、廢話幾條（Day 27 展開）

expectations:                          ; 跑之前寫下，跑完不改
  期望值算錯歸零: >
    猜會。約束寫得很死（第 1 條），而且 Day 22 的產物顯示它們很守約束——
    二十份沒有一份違反過那三條防作弊規則。
  可評分率: >
    猜比 Day 22 高。蛻變關係不必推導數值，
    Day 24 那 13 條「期望值算錯」的失敗方式在本輪不存在。
    但會出現新的失敗方式：關係本身寫錯（例如「壽命延長，目標金額應該不變」）。
  單獨變異分數: >
    **猜落在作者的 14.3% 與 Day 22 的 85.7% 之間，而且偏低。**
    蛻變關係天生比「鎖死一個數字」鬆——Day 25 已經量到這件事在作者身上成立。
    若它反而高於 85.7%，那是本輪最值得寫的結果。
  廢話關係: >
    猜每份至少一條。作者四條裡有三條是廢話，而作者是知道有這個陷阱才寫的。
  M14: >
    **猜沒有任何一份殺得掉。**
    Day 25 逐條推過：齊次、單調、支出端不變量、自我一致，四種都碰不到它。
    要殺它需要一條「通膨率與收入怎麼交互」的關係，那需要領域洞察。
    若有任何一份殺掉 M14，**那會是整個系列最重要的一個資料點**——
    它代表 AI 想出了一條連作者都沒想到的關係。
  自我提醒: 猜對不值得高興，猜錯才是資料

isolation:
  - 每一輪全新對話，無記憶、無個人化
  - 六個工具開關全關
  - 每臺模型截一張設定面板，存 preflight-A.png／preflight-B.png
  - 當天現場確認版本字串，不沿用本檔寫的名字

