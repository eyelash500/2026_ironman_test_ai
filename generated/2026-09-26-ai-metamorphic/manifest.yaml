  limitations:
    - 十份、一支計算機、同一家的兩臺模型。對帳 0/10 是預測兌現，不是定律
    - 「不變」與「結構」兩欄被提示詞的示範例子污染，不能當成 AI 的傾向
    - >
      主軸那件事（測試的價值取決於實作）是**存在性證明**，不是比率宣稱。
      一條關係、兩個實作、一綠一紅，這樣就夠證明「看不出來」這件事會發生，
      但不能推出「多少比例的關係測試是無效的」。
    - gate A 的 10/10 有結構性成分（蛻變關係不必推導數值），不宜當成模型變強
    - gate D 未執行，所以「哪幾條關係確定有用」本輪沒有答案

