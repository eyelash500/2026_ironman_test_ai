; 換一個問法：要關係，不要答案。
; 本檔在跑之前寫完。跑完只准往 execution_status 補記，不准改 expectations。

experiment:
  id: 2026-09-26-ai-metamorphic
  day: 26
  question: >
    Day 24 量到：AI 寫測試時，那個期望值的唯一來源是它自己，而人核不動。
    如果改成要它寫**蛻變關係**——不需要期望值的那種——產出會變成什麼？

design:
  變的只有一樣: >
    介面、規格、進入點的硬性約束，全部沿用 2026-09-22-scripts-matrix 的 PRD 組。
    `build_paste.py` 直接從那份貼上檔抽出「介面」與「規格」兩段原樣沿用，
    不重打（手打會讓變因不只一個），並自檢兩段與 Day 22 逐位元相同。
    **只換「要它交出什麼」**：
      Day 22　照規格寫 pytest　　→ 它必須自己算出一個期望值
      Day 26　照規格寫蛻變測試　→ 它必須自己想出一條關係
  不跑一句話組: >
    L1 組在 Day 22 已證明交不出能評分的東西（可評分率 0/5、單獨變異分數 0%）。
    本輪只跑 PRD 組，省一半。
  cells: PRD 組 × 兩臺模型（Gemini 3.1 Pro Preview／Gemini 3.8 Flash）
  runs_per_cell: 5
  total_generations: 10
  settings: Thinking High、temperature 1、六個工具全關（與 Day 22 相同）

  示範例子的處理:
    問題: >
      要教它「蛻變測試長什麼樣」就得舉例，但第一版舉的兩個例子
      （金額同乘 k、壽命延長）**剛好就是作者 Day 25 寫的 MR-01 與 MR-02**。
      那樣量到的會是「它會不會照抄」，不是「它想不想得到」。
    處置: >
      改用與本題領域無關的例子（`sort()` 的順序不變性與長度關係），
      只說明形狀，不給任何退休金相關的關係。
      **本題的關係要它自己從規格想出來。**
    掃描: 「齊次」「單調」「自我一致」「支出配置」等詞列入 must_not，實測 0 命中

  不指定條數: >
    提示詞沒有說「要寫幾條關係」。指定數量會逼它湊數，
    那樣量到的是「它能生出幾條」，不是「它想得到幾條」。
    代價：可能只寫兩三條，資料會薄。
    Day 22 同樣沒指定，產出是 8–27 條測試函式，風險可接受。

  要求逐條註解: >
    硬性約束第 6 條要求每條關係前面寫一句「把輸入怎麼變、輸出該有什麼關係、為什麼」。
    這條是為了稽核——沒有它，讀不出它想表達的關係是什麼，
    只能從程式碼反推，而反推就是在替它補完意圖。

  leak_scan:
    tool: tools/leak_scan.py
    config: leak_config.py（跑之前定）
    result: 通過
    accepted_hits: >
      「不得」（硬性約束的措辭）、「禁止」「Math.max」
      （PRD-03／04／12 的本文，Day 11 已認定為效度威脅，沿用 Day 22 的判定）

relation_taxonomy:                     ; 跑之前定，Day 26／27 共用
  說明: >
    逐條讀 AI 寫的每一條關係（硬性約束第 6 條要求它附註解），
    按「它問的是什麼」歸類。不看程式碼寫得好不好，只看它想驗的是哪一種性質。
  類別:
    對帳: >
      斷言的兩邊來自程式的**兩個不同輸出**（或同一件事的兩種算法），
      要求它們吻合。例：資金 = 目標金額 → 期末餘額為 0。
      **這是作者的 MR-04，也是唯一抓到缺陷 A 的那一類。**
    縮放: 改變輸入的尺度，要求輸出等比例變化（作者的 MR-01）
    單調: 改變一個輸入，要求輸出的方向固定（作者的 MR-02）
    不變: 改變輸入的表示但不改語意，要求輸出完全不變（作者的 MR-03）
    退化: >
      把參數設成特殊值讓公式退化成已知的簡單形式
      （例如 r = 0 時累積應退化成線性累加）。
      **作者沒寫這一類。** 若 AI 寫出來，那是它想到了作者沒想到的。
    其他: 歸不進上面五類的，照實記，不硬塞
  判定者: 人工。工具不猜

pass_criteria:                         ; 與 Day 22 同一條流水線
  gate_a_inspector: tools/assert_inspector.py，忠實性 >= 0.8、無 EMPTY、無 VACUUM_ONLY
  gate_b_baseline: 未變異的 calc_fixed 上必須全綠，紅的不代改不補跑
  gate_c_mutation: >
    過了前兩關的，交給 harness 跑十四個領域變異體。
    **合計與單獨都要跑**（--solo），理由同 Day 22：
    合計會被 golden 的 85.7% 灌滿，看不出這份腳本自己的殺傷力。
  gate_d_relation_audit: >
    **本輪新增。** 用 Day 25 的 `tools/mr_audit.py` 逐條看它提的關係殺得掉幾個。
    **這把尺只能證實，不能證偽**（Day 25 的更正）：
    殺得掉 → 那條關係有用；殺不掉 → 只說明這十四種錯法碰不到它。
    所以這一關不用來判「AI 的關係沒用」，只用來指認「哪幾條確定有用」。

metrics:
  期望值算錯: >
    Day 24 量到 13 條（去重後 50%）。
    本輪**結構上應該歸零**——提示詞禁止寫死期望值。
    這是由設計保證的，不是發現，所以它不是主要指標，是檢查提示詞有沒有生效。
  可評分率: Day 22 的 PRD 組是 2/5（Pro）與 1/5（Flash）
  單獨變異分數: Day 22 的 PRD 組是 85.7%；作者手寫的四條關係是 14.3%
  關係的分類: >
    **本輪主指標。** 分數是次要的——它會被「殺得掉幾個」那把單向尺限制住。
    真正要讀的是：**它寫出了哪幾類關係。**
    分類法跑之前定（見 relation_taxonomy），逐條人工歸類。

分支計畫:                              ; 跑之前定，免得當天臨場決定
  若沒有任何一份寫出「對帳」類:
    判定: Day 25 結尾封存的預測成立
    Day 26 的重心: >
      它寫出了什麼、沒寫出什麼。
      對照 Day 22／23 已量過的傾向：它挑好算的數、寫大量看起來合理的弱斷言——
      **偏好寫起來順、讀起來合理的東西**，而對帳那類繞、醜、容易寫錯。
    Day 27 的重心: 那些關係有沒有用（變異體驗收）＋ 人與 AI 的對照
    對 checklist 的貢獻: >
      要 AI 寫關係，得**明確要求「找兩個該吻合的出口」**，
      否則它會給你縮放與單調。這是可以直接寫進提示詞的一句話。

  若有任何一份寫出「對帳」類:
    判定: **預測猜錯。** 這是第四幕最重要的資料點
    Day 26 的重心 換成: >
      它是怎麼想到的——讀它附的註解，看它是從哪一條規格推出來的。
      （硬性約束第 6 條要求每條關係附一句說明，就是為了這一刻。）
    Day 27 的重心 換成: >
      **它寫的那條對帳關係，對不對。**
      對帳關係最容易寫成假的：如果斷言的兩邊其實走的是同一段程式，
      那「對帳」就等於沒對——兩邊一起錯的時候它一樣綠。
      判準（跑之前定）：
        真對帳　斷言兩邊各自來自程式中**不同的計算路徑**
        假對帳　兩邊追溯回去是同一段程式，或其中一邊是另一邊的直接改寫
      逐條追溯到 `calc_fixed.py` 的行號，人工判。
    額外要驗的: 它那條對帳關係，在 legacy 上抓不抓得到缺陷 A

  若寫出「退化」類: >
    那是作者四條裡沒有的。不論它有沒有用，都要記——
    **這一格是特意留給「它想到我沒想到的」的。**
    留這一格的理由：只留「它比我弱」的格子，量出來的一定是它比我弱。

expectations:                          ; 跑之前寫下，跑完不改
  期望值算錯歸零: >
    猜會。約束寫得很死（第 1 條），而且 Day 22 的產物顯示它們很守約束——
    二十份沒有一份違反過那三條防作弊規則。
  可評分率: >
    猜比 Day 22 高。蛻變關係不必推導數值，
    Day 24 那 13 條「期望值算錯」的失敗方式在本輪不存在。
    但會出現新的失敗方式：關係本身寫錯（例如「壽命延長，目標金額應該不變」）。
  單獨變異分數: >
    **猜落在作者的 14.3% 與 Day 22 的 85.7% 之間，而且偏低。**
    蛻變關係天生比「鎖死一個數字」鬆——Day 25 已經量到這件事在作者身上成立。
    若它反而高於 85.7%，那是本輪最值得寫的結果。
  殺不掉的關係: >
    猜每份至少一條殺不掉任何變異體。
    作者四條裡有三條如此，而作者是知道有這個陷阱才寫的。
    **但「殺不掉」不寫成「廢話」**——那是 Day 25 犯過的錯。
  M14: >
    **猜沒有任何一份殺得掉。**
    Day 25 逐條推過：齊次、單調、支出端不變量、自我一致，四種都碰不到它。
    要殺它需要一條「通膨率與收入怎麼交互」的關係，那需要領域洞察。
    若有任何一份殺掉 M14，**那會是整個系列最重要的一個資料點**——
    它代表 AI 想出了一條連作者都沒想到的關係。
  自我提醒: 猜對不值得高興，猜錯才是資料

isolation:
  - 每一輪全新對話，無記憶、無個人化
  - 六個工具開關全關
  - 每臺模型截一張設定面板，存 preflight-A.png／preflight-B.png
  - 當天現場確認版本字串，不沿用本檔寫的名字

execution_status:
  state: 已執行
  date: 2026-09-26（生成）／2026-09-27（驗收與分析）
  runner: 作者本機

  model_versions:                      ; 現場由 preflight 截圖確認，不沿用設計段寫的名字
    run-A: gemini-3.1-pro-preview（Gemini 3.1 Pro Preview）
    run-B: gemini-3.8-flash（Gemini 3.8 Flash）
    兩臺共同: Thinking level High、六個工具全關、output length 65536
    temperature: >
      A 的截圖顯示 1。**B 的截圖沒有截到 temperature 欄位**，
      無法由截圖佐證，照實記。
    版本級數的更正: >
      初版把 3.1 Pro 與 3.8 Flash 之間的數字差當成世代差。那是錯的——
      兩條產品線本來就不是同一組編號，推出時也不是同一級數。
      本輪只當成「兩臺不同的模型」，不作世代比較。
    Flash 的重跑: >
      第一次跑時 Thinking level 誤設為 Medium，該批作廢重跑。
      現存的五份 run-B 全部是 High。

  gate_a:                              ; tools/assert_inspector.py，原始輸出 results/gate-a.txt
    結果: 十份全部 PASS
    忠實性: 89% – 100%（A-MR-03 89%、A-MR-04 92%，其餘八份 100%）
    對照 Day 22: >
      Day 22 的 PRD 組可評分率是 2/5（Pro）與 1/5（Flash）。本輪 10/10。
      **但這個提升有結構性的成分**：蛻變關係不必推導數值，
      Day 24 那 13 條「期望值算錯」的失敗方式在本輪不存在。
      提升是真的，原因大半由設計決定，不宜當成模型變強。

  gate_b:                              ; 原始輸出 results/gate-b.txt
    結果: 九份全綠；run-A-MR-01 一條紅（11 passed, 1 failed）
    紅的那一條: test_mr_income_expense_equivalence
    驗屍: >
      它主張「固定年支出與其他收入同時調增相同金額 → 目標金額不變」，
      理由寫的是「兩者通膨基準皆為現齡 A_c」。
      **理由那半句完全正確**，實作 109 與 129 行確實都用 `t - current_age`。
      錯在單位：
        109 行　expense_base_today = 月支出 * 12 + annual_recurring_expense  ← 年額
        129 行　total_income += other_income * 12 * (...)                    ← 月額 ×12
      兩邊各加 200,000，支出端加的是年 20 萬，收入端加的是年 240 萬，差十二倍。
    為什麼這一條重要: >
      **推理對，關係錯。而 gate A 給這份 100% 忠實性。**
      忠實性量的是「斷言有沒有忠實表達它宣告的意圖」，
      不是「那個意圖對不對」。事前預測欄寫過會出現
      「關係本身寫錯」這種新失敗方式（見 expectations 的可評分率條），實測出現，1/143。

  gate_c:                              ; 原始輸出 results/gate-c.txt
    單獨變異分數: >
      A-MR-02 28.6%／A-MR-03 14.3%／A-MR-04 28.6%／A-MR-05 21.4%
      B-MR-01 35.7%／B-MR-02 21.4%／B-MR-03 35.7%／B-MR-04 35.7%／B-MR-05 28.6%
      （run-A-MR-01 基準線紅，依 Day 18 的規矩中止，不計分）
    合計變異分數: 九份中八份 85.7%，B-MR-01 達 92.9%
    B-MR-01 的 92.9%: >
      golden v2 單獨是 85.7%（12/14）。B-MR-01 合計 13/14，
      代表它的關係殺掉了一個 golden 漏掉的變異體。
      **是哪一個沒有查**——那要 gate D 的逐條資料。留給 Day 27。

  gate_d:
    state: 未執行
    工具: tools/mr_audit_batch.py（已寫好，5 條 KAT 通過，未實跑）
    腳本: _unused/gate-d.sh
    為什麼不跑: >
      143 條 × 14 個變異體約兩千次 pytest，而 Day 26 的主軸不依賴分數。
      更根本的理由：Day 25 已經封死那條路——**那把尺只能證實，不能證偽**。
      判斷一條關係在測什麼，要讀原始碼，不是看它殺得掉幾個。
      這一關留給 Day 27。

  關係的分類:                          ; 事前定為主指標，實測後降級，理由如下
    對帳: >
      **0 條。十份無一。** 三個互相獨立的掃描全部空手：
        一、沒有任何一份把 target_fund 餵回去當 current_savings
        二、沒有任何一份斷言期末餘額為 0
        三、沒有任何一份的斷言同時碰到 target_fund 與 balances
      **Day 25 結尾封存的預測成立**，走「若沒有任何一份寫出對帳類」那一支。
    分布表為什麼降級: >
      逐條人工分類做完了（143 條，_unused/classify.py，3 條 KAT），
      但**分布撐不住效度威脅**，見下。所以只保留「對帳 0 條」這個
      由三個獨立掃描直接佐證、不依賴分類判斷的事實。

  效度威脅:                            ; 跑完才發現，照實記
    問題: >
      提示詞為了說明蛻變測試的形狀，舉了 `sort()` 的例子：
        「把 xs 的順序打亂 → 結果必須完全相同」      ← 示範了「不變」
        「多加一個元素 → 長度必須剛好多 1」          ← 示範了「結構」
      而產出裡「不變」63 條是最大宗、「結構」6 條，
      其中「打亂大筆支出順序」4 份、「壽命 +N → 軌跡長度 +N」6 條，
      幾乎是那兩行的逐字翻譯。**分布有一部分是提示詞自己的回音。**
    跟設計段那個處置的關係: >
      設計段的「示範例子的處理」已經處理過一次同類問題——
      初版的兩個例子剛好是作者 Day 25 的 MR-01 與 MR-02，換掉了。
      **但那次只換掉了領域洩漏，沒察覺形狀洩漏。**
      leak_scan 掃的是「齊次」「單調」這些詞有沒有出現，
      它掃不到「示範了兩種形狀」這件事。
    為什麼不重跑: >
      任何例子都在示範某種形狀，換一個例子只是換一種污染。
      **這件事沒有乾淨解。** 處置是不宣稱分布，不是重跑。
    影響範圍: >
      「不變」與「結構」兩欄不能當成 AI 的傾向。
      不受影響的：對帳 0（沒示範過對帳形狀）、退化 7 條（沒示範過）、
      單調 27 條（沒示範過）。

  撤回:                                ; 2026-09-27，寫作前自行發現
    被撤回的判定: 分類表裡的「定義性恆等」一欄（5 條，5 份）
    原本的說法: >
      五份寫了「缺口的減少量 == 資產的增加量」，
      判為「長得像對帳的恆真命題」，一度要當成文章主軸。
    為什麼錯: >
      `retirement_gap` 在 calc_fixed.py 153 行就是 `target_fund - projected_savings`，
      所以恆等式 Δ缺口 ≡ Δ目標金額 − Δ資產 永遠成立。代進那五條的斷言：
        斷言 Δ缺口 == −Δ資產  ⟺  Δ目標金額 == 0
      而那五條全部只動期初資金。**它們斷言的是正交性**——
      一條貨真價實、變異體打得到的關係，不是恆真命題。
    錯法: >
      看形狀判的，沒做代數。
      **與 Day 25 把「殺 0 個」讀成「廢話」是同一種錯**，相隔兩天。
    怎麼被抓到的: 作者問「這樣可以達到文章目的嗎」，回頭去對原始碼才發現

  主軸發現:                            ; 本日文章的重心
    一句話: >
      一條「兩個輸出該吻合」的測試，值不值錢，
      取決於那兩個輸出是不是同一段程式算出來的。
      **而這件事從測試本身完全看不出來。**
    證據是十份全寫的那一條: >
      `balances_charted` 必須逐項等於 `balances_raw`（PRD-12）。
      **10/10，是唯一一條全員都寫的關係。**
      看起來是最紮實的那種：兩個輸出、逐項比對、直接對應規格條目。
    在 calc_fixed 上它恆綠: >
      148 行 `balances_tuple = tuple(balances)`，
      154 行 `balances_raw=balances_tuple`，
      156 行 `balances_charted=balances_tuple`。
      **同一個物件。** 這條斷言在比較一個東西跟它自己，
      不管實作怎麼壞都不會紅。
    在 legacy 上它一秒抓到: >
      121 行 `charted.append(max(0.0, remaining))`，
      127／128 行 `raw` 與 `charted` 是兩條各自累積的 list。
      同一條斷言在 index 2 就紅：圖表 0.00、真實 −8,503,876.79，
      26 年裡 23 年被夾平。
    示範腳本: >
      tests/test_day26_demo.py。那條關係**一個字都沒改**，
      原樣取自 run-A-MR-01，只把實作變成參數同時跑兩邊。
      另附兩條用 `is` 把「恆綠的原因是同一個物件」釘死的對照。
      實測：legacy FAILED、fixed PASSED、兩條 `is` 對照都 PASSED。
    一個容易略過的附帶條件: >
      AI 在這條測試裡把月支出設成 500,000，刻意讓餘額跌破零。
      若輸入沒走到負值，`max(0.0, remaining)` 就等於 `remaining`，
      這條測試在 legacy 上一樣是綠的。十份裡兩份（B-MR-02、B-MR-05）沒有刻意壓負。
      **要有價值需要兩個條件同時成立**：
      兩個輸出真的來自不同路徑，而且輸入走得到兩條路徑分歧的地方。

